name: Deploy Frontend para Hostinger

on:
  push:
    branches: [ main, master ]
    paths:
      - 'index.html'
      - 'classico.html'
      - 'nova.html'
      - 'css/**'
      - 'js/**'
      - 'api/**'
      - 'database/**'
      - 'scripts/**'
      - 'manifest.json'
      - 'sw.js'
      - 'CNAME'
      - '.github/workflows/deploy-hostinger.yml'
  workflow_dispatch:

jobs:
  deploy-frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Verificar secrets configurados
        run: |
          if [ -z "${{ secrets.FTP_SERVER }}" ]; then echo "❌ FTP_SERVER não configurado"; exit 1; fi
          if [ -z "${{ secrets.FTP_USERNAME }}" ]; then echo "❌ FTP_USERNAME não configurado"; exit 1; fi
          if [ -z "${{ secrets.FTP_PASSWORD }}" ]; then echo "❌ FTP_PASSWORD não configurado"; exit 1; fi
          echo "✅ Secrets FTP presentes"

      - name: Preparar arquivos do frontend
        env:
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        run: |
          mkdir -p deploy/api
          cp index.html deploy/
          [ -f "classico.html" ] && cp classico.html deploy/
          cp -r css js database deploy/
          cp -r api/. deploy/api/
          [ -f "nova.html" ] && cp nova.html deploy/
          [ -f "manifest.json" ] && cp manifest.json deploy/
          [ -f "sw.js" ] && cp sw.js deploy/
          [ -f ".htaccess" ] && cp .htaccess deploy/
          [ -f "CNAME" ] && cp CNAME deploy/
          node scripts/generate-deploy-config.js
          echo "✅ Arquivos prontos ($(find deploy -type f | wc -l) arquivos):"
          find deploy -type f | sort

      - name: Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          local-dir: deploy/
          server-dir: ./
          security: loose
          timeout: 120000
          log-level: verbose
          dry-run: false

      - name: Deploy concluído
        run: echo "✅ Site publicado em financasmais.com"

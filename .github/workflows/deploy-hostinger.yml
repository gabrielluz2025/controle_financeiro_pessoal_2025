name: Deploy Frontend para Hostinger

on:
  push:
    branches: [ main, master ]
    paths:
      - 'index.html'
      - 'classico.html'
      - 'nova.html'
      - 'css/**'
      - 'js/**'
      - 'api/**'
      - 'database/**'
      - 'scripts/**'
      - 'manifest.json'
      - 'sw.js'
      - 'CNAME'
      - '.github/workflows/deploy-hostinger.yml'
  workflow_dispatch:

jobs:
  deploy-frontend:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Verificar secrets configurados
        run: |
          if [ -z "${{ secrets.FTP_SERVER }}" ]; then echo "❌ FTP_SERVER não configurado"; exit 1; fi
          if [ -z "${{ secrets.FTP_USERNAME }}" ]; then echo "❌ FTP_USERNAME não configurado"; exit 1; fi
          if [ -z "${{ secrets.FTP_PASSWORD }}" ]; then echo "❌ FTP_PASSWORD não configurado"; exit 1; fi
          echo "✅ Secrets FTP presentes: servidor=${{ secrets.FTP_SERVER }}"

      - name: Preparar arquivos do frontend
        env:
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        run: |
          mkdir -p deploy/api
          cp index.html deploy/
          [ -f "classico.html" ] && cp classico.html deploy/
          cp -r css js database deploy/
          cp -r api/. deploy/api/
          [ -f "nova.html" ] && cp nova.html deploy/
          [ -f "manifest.json" ] && cp manifest.json deploy/
          [ -f "sw.js" ] && cp sw.js deploy/
          [ -f ".htaccess" ] && cp .htaccess deploy/
          [ -f "CNAME" ] && cp CNAME deploy/
          node scripts/generate-deploy-config.js
          echo "✅ Arquivos prontos para deploy:"
          find deploy -type f | sort

      - name: Instalar lftp
        run: sudo apt-get install -y lftp

      - name: Testar conexão FTP
        run: |
          lftp -u "${{ secrets.FTP_USERNAME }}","${{ secrets.FTP_PASSWORD }}" \
               -e "set ftp:ssl-allow yes; set ssl:verify-certificate no; ls; quit" \
               ftp://${{ secrets.FTP_SERVER }} \
          && echo "✅ Conexão FTP OK" \
          || (echo "❌ Falha na conexão FTP — verifique FTP_SERVER/FTP_USERNAME/FTP_PASSWORD"; exit 1)

      - name: Deploy via FTP (lftp mirror)
        run: |
          lftp -u "${{ secrets.FTP_USERNAME }}","${{ secrets.FTP_PASSWORD }}" \
               ftp://${{ secrets.FTP_SERVER }} <<'LFTP_SCRIPT'
          set ftp:ssl-allow yes
          set ssl:verify-certificate no
          set net:timeout 30
          set net:max-retries 3
          mirror --reverse --delete --verbose \
                 ./deploy/ \
                 ./
          quit
          LFTP_SCRIPT
          echo "✅ Deploy concluído!"

name: Deploy Frontend para Hostinger

on:
  push:
    branches: [ main, master ]
    paths:
      - 'index.html'
      - 'css/**'
      - 'js/**'
      - 'services/**'
      - 'api/**'
      - '.github/workflows/deploy-hostinger.yml'
  workflow_dispatch:

jobs:
  deploy-frontend:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Preparar arquivos do frontend
        env:
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        run: |
          mkdir -p deploy
          cp index.html deploy/
          cp -r css js services api deploy/
          node -e "const fs=require('fs'); const esc=v=>String(v??'').replace(/\\/g,'\\\\').replace(/'/g,\"\\\\'\"); const cfg={db_host:'localhost',db_name:process.env.DB_NAME,db_user:process.env.DB_USER,db_pass:process.env.DB_PASSWORD}; const php='<?php\\nreturn [\\n'+Object.entries(cfg).map(([k,v])=>`    '${k}' => '${esc(v)}'`).join(',\\n')+'\\n];\\n'; fs.writeFileSync('deploy/api/config.php', php);"

      - name: Deploy via FTP para Hostinger
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./deploy/
          server-dir: ./
          security: loose

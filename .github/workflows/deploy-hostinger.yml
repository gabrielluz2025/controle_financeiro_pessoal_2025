name: Deploy Frontend para Hostinger

on:
  push:
    branches: [ main, master ]
    paths:
      - 'index.html'
      - 'css/**'
      - 'js/**'
      - 'api/**'
      - 'database/**'
      - 'scripts/**'
      - '.htaccess'
      - 'CNAME'
      - '.github/workflows/deploy-hostinger.yml'
  workflow_dispatch:

jobs:
  deploy-frontend:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Verificar secrets configurados
        run: |
          if [ -z "${{ secrets.FTP_SERVER }}" ]; then echo "❌ FTP_SERVER não configurado"; exit 1; fi
          if [ -z "${{ secrets.FTP_USERNAME }}" ]; then echo "❌ FTP_USERNAME não configurado"; exit 1; fi
          if [ -z "${{ secrets.FTP_PASSWORD }}" ]; then echo "❌ FTP_PASSWORD não configurado"; exit 1; fi
          echo "✅ Secrets FTP verificados"

      - name: Preparar arquivos do frontend
        env:
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        run: |
          mkdir -p deploy/api
          cp index.html deploy/
          cp -r css js database deploy/
          cp -r api/. deploy/api/
          if [ -f ".htaccess" ]; then cp .htaccess deploy/; fi
          if [ -f "CNAME" ]; then cp CNAME deploy/; fi
          node scripts/generate-deploy-config.js
          echo "✅ Arquivos preparados:"
          ls -la deploy/
          ls -la deploy/api/

      - name: Deploy via FTP para Hostinger
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./deploy/
          server-dir: ./
          security: loose
          timeout: 60000
          log-level: verbose

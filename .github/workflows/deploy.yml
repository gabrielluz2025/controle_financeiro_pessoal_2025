name: Deploy Sistema Financeiro

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

env:
  NODE_VERSION: '18.x'

jobs:
  # ================================================
  # JOB: Testes e Validação
  # ================================================
  test:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout código
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'

    - name: Instalar dependências
      run: npm ci

    - name: Executar lint
      run: npm run lint --if-present

    - name: Executar testes
      run: npm test --if-present

  # ================================================
  # JOB: Build
  # ================================================
  build:
    needs: test
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout código
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'

    - name: Instalar dependências
      run: npm ci

    - name: Build projeto
      run: npm run build --if-present

    - name: Upload artefatos
      uses: actions/upload-artifact@v4
      with:
        name: build-artifacts
        path: |
          dist/
          index.html
          css/
          js/
          services/
          server/

  # ================================================
  # JOB: Deploy para GitHub Pages (Frontend)
  # ================================================
  deploy-pages:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    
    permissions:
      contents: read
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
    - name: Checkout código
      uses: actions/checkout@v4

    - name: Setup Pages
      uses: actions/configure-pages@v4

    - name: Upload para Pages
      uses: actions/upload-pages-artifact@v3
      with:
        path: '.'

    - name: Deploy para GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4

  # ================================================
  # JOB: Segurança - Análise de Vulnerabilidades
  # ================================================
  security:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout código
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}

    - name: Instalar dependências
      run: npm ci

    - name: Auditoria de segurança
      run: npm audit --audit-level=high
      continue-on-error: true

    - name: Verificar dependências desatualizadas
      run: npm outdated || true

  # ================================================
  # JOB: Notificação
  # ================================================
  notify:
    needs: [deploy-pages]
    runs-on: ubuntu-latest
    if: always()
    
    steps:
    - name: Status do Deploy
      run: |
        echo "🚀 Deploy concluído!"
        echo "📊 Status: ${{ needs.deploy-pages.result }}"
        echo "🔗 URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/"

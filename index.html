<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#1e40af">
<link rel="manifest" href="/manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Finanças+</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#eef1f6; --bg2:#fff; --card:#fff; --card-brd:#d8dee9;
  --txt:#1a2332; --txt2:#4a5568; --txt3:#7a8699;
  --brand:#1e40af; --brand-soft:#eff6ff; --brand-hover:#1d4ed8;
  --pos:#047857; --pos-soft:#ecfdf5; --neg:#b91c1c; --neg-soft:#fef2f2; --warn:#b45309; --warn-soft:#fffbeb;
  --r:10px; --r2:8px; --shadow:0 1px 2px rgba(16,24,40,.06),0 1px 3px rgba(16,24,40,.08);
  --sidebar-w:14.5rem; --content-max:82rem;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg);color:var(--txt);font-family:'Inter',system-ui,sans-serif;-webkit-font-smoothing:antialiased;min-height:100vh;font-size:15px;line-height:1.45}
body{overflow-x:hidden}
.num{font-variant-numeric:tabular-nums;letter-spacing:-.01em}

/* ── Shell: sidebar (desktop) + main ── */
.shell{display:flex;min-height:100vh;width:100%}
.main{flex:1;min-width:0;width:100%;max-width:var(--content-max);margin:0 auto;padding:0 1rem 1.5rem}
.main-inner{width:100%}

.top{display:flex;align-items:center;justify-content:space-between;padding:calc(18px + env(safe-area-inset-top)) 2px 14px}
.hi{font-size:13px;color:var(--txt2);font-weight:500}
.hi b{display:block;font-size:19px;color:var(--txt);font-weight:800;margin-top:1px;letter-spacing:-.02em}
.top-actions{display:flex;gap:8px;align-items:center}
.chip-link{font-size:11px;font-weight:700;color:var(--txt2);border:1px solid var(--card-brd);background:var(--card);padding:7px 11px;border-radius:999px;text-decoration:none;transition:.2s;cursor:pointer}
.chip-link:hover{border-color:rgba(124,123,255,.35);color:var(--txt)}
.chip-link:active{transform:scale(.95)}
.ava{width:38px;height:38px;border-radius:8px;background:var(--brand);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;color:#fff}

.page-title{font-size:1.35rem;font-weight:700;padding:2px 2px 12px;color:var(--txt)}
.page-sub{font-size:.8125rem;color:var(--txt3);margin:-8px 2px 14px}

/* Home grid — responsivo */
.home-grid{display:grid;gap:16px;grid-template-columns:1fr}
.home-bottom{display:grid;gap:16px;grid-template-columns:1fr}
.grid-2{display:grid;gap:16px;grid-template-columns:1fr}
.accounts-grid{display:grid;gap:16px;grid-template-columns:1fr}

.hero,.summary-card{background:var(--card);border:1px solid var(--card-brd);border-radius:var(--r);padding:18px 20px;box-shadow:var(--shadow);margin-bottom:0;border-left:4px solid var(--brand)}
.hero-lbl,.summary-lbl{font-size:11px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--txt3);display:flex;align-items:center;gap:8px}
.eye{cursor:pointer;font-size:14px}
.hero-val,.summary-val{font-size:clamp(1.65rem,3vw,2rem);font-weight:700;color:var(--txt);margin-top:6px}
.hero-delta,.summary-delta{display:inline-flex;align-items:center;gap:4px;margin-top:8px;font-size:12px;font-weight:600;padding:4px 10px;border-radius:6px;background:var(--bg)}
.hero-delta.up,.summary-delta.up{color:var(--pos);background:var(--pos-soft)}
.hero-delta.down,.summary-delta.down{color:var(--neg);background:var(--neg-soft)}
.hero-spark{margin-top:12px;height:36px;opacity:.85}

.trio{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:0}
.stat{background:var(--card);border:1px solid var(--card-brd);border-radius:var(--r2);padding:12px;box-shadow:var(--shadow)}
.stat .ic{width:28px;height:28px;border-radius:6px;display:flex;align-items:center;justify-content:center;margin-bottom:8px;font-size:14px;font-weight:700;background:var(--bg)}
.stat .k{font-size:10px;color:var(--txt3);font-weight:600;text-transform:uppercase;letter-spacing:.03em}
.stat .v{font-size:clamp(.85rem,1.4vw,.95rem);font-weight:700;margin-top:2px}

.sec{background:var(--card);border:1px solid var(--card-brd);border-radius:var(--r);padding:16px;margin-bottom:0;box-shadow:var(--shadow)}
.sec-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;gap:8px}
.sec-t{font-size:.9375rem;font-weight:700;color:var(--txt)}
.sec-sub{font-size:.75rem;color:var(--txt3);font-weight:500}
.seg{display:flex;gap:2px;background:var(--bg);padding:3px;border-radius:8px;border:1px solid var(--card-brd)}
.seg button{border:0;background:transparent;color:var(--txt3);font-size:11px;font-weight:600;padding:5px 10px;border-radius:6px;cursor:pointer}
.seg button.on{background:var(--card);color:var(--brand);box-shadow:var(--shadow)}

.insight{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:8px;margin-bottom:12px;border:1px solid transparent;font-size:13px}
.insight .dot{width:8px;height:8px;border-radius:50%;margin-top:5px;flex:0 0 auto}
.insight .it{font-size:13px;font-weight:700}
.insight .im{font-size:12px;color:var(--txt2);margin-top:2px;line-height:1.45}
.ins-good{background:var(--pos-soft);border-color:#a7f3d0}.ins-good .dot{background:var(--pos)}
.ins-warn{background:var(--warn-soft);border-color:#fde68a}.ins-warn .dot{background:var(--warn)}
.ins-bad{background:var(--neg-soft);border-color:#fecaca}.ins-bad .dot{background:var(--neg)}

.cf-metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.cf-m{text-align:center;padding:10px 6px;background:var(--bg);border-radius:8px;border:1px solid var(--card-brd)}
.cf-m .k{font-size:9px;color:var(--txt3);font-weight:700;text-transform:uppercase;letter-spacing:.04em}
.cf-m .v{font-size:14px;font-weight:800;margin-top:3px}
.cf-chart{height:clamp(140px,22vw,220px);width:100%}
.cf-chart svg{width:100%;height:100%;display:block}

.cat{margin-bottom:13px}.cat:last-child{margin-bottom:0}
.cat-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.cat-name{font-size:12.5px;font-weight:700;display:flex;align-items:center;gap:8px}
.cat-emoji{width:26px;height:26px;border-radius:8px;background:var(--bg);display:flex;align-items:center;justify-content:center;font-size:14px}
.cat-val{font-size:12.5px;font-weight:800;color:var(--txt2)}
.bar{height:8px;border-radius:999px;background:var(--bg);overflow:hidden;border:1px solid var(--card-brd)}
.bar i{display:block;height:100%;border-radius:999px;background:var(--brand);width:0}

.tx{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--card-brd);cursor:pointer}
.tx:last-child{border-bottom:0}
.tx-ic{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:17px;flex:0 0 auto}
.tx-mid{flex:1;min-width:0}
.tx-d{font-size:13.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tx-s{font-size:11px;color:var(--txt3);margin-top:1px}
.tx-v{font-size:14px;font-weight:800;white-space:nowrap}
.date-h{font-size:11px;font-weight:800;color:var(--txt3);text-transform:uppercase;letter-spacing:.06em;margin:16px 2px 4px}

.acc-row{display:flex;align-items:center;gap:13px;padding:14px;background:var(--card);border:1px solid var(--card-brd);border-radius:var(--r2);margin-bottom:10px;cursor:pointer;transition:.15s}
.acc-row:active{transform:scale(.99)}
.acc-ic{width:44px;height:44px;border-radius:13px;display:flex;align-items:center;justify-content:center;font-size:20px;flex:0 0 auto;background:rgba(124,123,255,.15)}
.acc-mid{flex:1;min-width:0}
.acc-n{font-size:14px;font-weight:800}
.acc-t{font-size:11px;color:var(--txt3);margin-top:1px}
.acc-v{font-size:15px;font-weight:800;text-align:right}
.progress{height:6px;border-radius:999px;background:var(--bg);overflow:hidden;margin-top:8px;border:1px solid var(--card-brd)}
.progress i{display:block;height:100%;border-radius:999px;background:var(--brand)}
.add-btn{width:100%;border:1px dashed var(--card-brd);background:var(--bg);color:var(--brand);font-weight:600;font-size:13px;padding:12px;border-radius:var(--r2);cursor:pointer;font-family:inherit;margin-top:4px}
.add-btn:hover{background:var(--brand-soft)}

.empty{text-align:center;padding:26px 14px}
.empty .e{font-size:34px}.empty p{color:var(--txt2);font-size:13px;margin-top:8px;line-height:1.5}

.nav{z-index:50;display:flex;align-items:flex-end;justify-content:space-around;background:var(--card);border-top:1px solid var(--card-brd);box-shadow:0 -2px 8px rgba(16,24,40,.06)}
.nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--txt3);font-size:10px;font-weight:600;cursor:pointer;padding:6px 0;border:0;background:0;font-family:inherit}
.nav button svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2}
.nav button.on{color:var(--brand)}
.nav .plus{flex:0 0 auto;display:flex;align-items:center}
.nav .plus b{display:flex;align-items:center;justify-content:center;width:48px;height:48px;border-radius:12px;background:var(--brand);color:#fff;font-size:22px;margin-top:-18px;border:3px solid var(--bg);cursor:pointer;flex-shrink:0;box-shadow:var(--shadow)}
.plus-lbl{display:none}
.nav-spacer{display:none}

.sidebar-brand{display:none;padding:1rem .85rem .75rem;font-weight:700;font-size:1.05rem;color:var(--brand);border-bottom:1px solid var(--card-brd);margin-bottom:.35rem}
.sidebar-brand span{color:var(--txt3);font-size:.7rem;font-weight:500;display:block;margin-top:2px}

/* Sheet — bottom mobile / centered desktop */
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.6);backdrop-filter:blur(4px);z-index:60;opacity:0;pointer-events:none;transition:.25s}
.sheet-bg.open{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:61;background:var(--bg2);border-radius:26px 26px 0 0;padding:8px 20px calc(26px + env(safe-area-inset-bottom));max-width:32rem;margin:0 auto;transform:translateY(105%);transition:transform .32s cubic-bezier(.2,.9,.2,1);border-top:1px solid var(--card-brd);max-height:92vh;overflow-y:auto}
.sheet.open{transform:translateY(0)}
.grab{width:40px;height:4px;border-radius:999px;background:var(--card-brd);margin:8px auto 18px}
.sheet-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.sheet h3{font-size:18px;font-weight:800}
.del-btn{background:rgba(251,113,133,.14);color:var(--neg);border:0;font-weight:800;font-size:12px;padding:8px 12px;border-radius:10px;cursor:pointer;font-family:inherit}
.type-tog{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:16px;background:var(--bg);padding:5px;border-radius:10px;border:1px solid var(--card-brd)}
.type-tog button{border:0;background:transparent;color:var(--txt2);font-weight:800;font-size:13px;padding:11px;border-radius:10px;cursor:pointer;font-family:inherit;transition:.2s}
.type-tog button.on-exp{background:rgba(251,113,133,.16);color:var(--neg)}
.type-tog button.on-inc{background:rgba(52,211,153,.16);color:var(--pos)}
.fld{margin-bottom:13px}
.fld.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fld label{display:block;font-size:11px;font-weight:700;color:var(--txt3);text-transform:uppercase;letter-spacing:.05em;margin-bottom:6px}
.fld input,.fld select,.fld textarea{width:100%;background:var(--card);border:1px solid var(--card-brd);border-radius:8px;padding:13px 14px;color:var(--txt);font-size:15px;font-family:inherit;outline:none;transition:.2s}
.fld input:focus,.fld select:focus,.fld textarea:focus{border-color:var(--brand)}
.fld textarea{min-height:3.2rem;resize:vertical}
.big-in{font-size:26px!important;font-weight:800;text-align:center}
.chk{display:flex;align-items:center;gap:10px;padding:12px;background:var(--bg);border-radius:8px;margin-bottom:13px;cursor:pointer;border:1px solid var(--card-brd)}
.chk input{width:20px;height:20px;accent-color:var(--brand)}
.chk span{font-size:13px;font-weight:600}
.save{width:100%;background:var(--brand);color:#fff;border:0;padding:14px;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit;margin-top:6px}
.save:hover{background:var(--brand-hover)}
.badge{display:inline-block;font-size:10px;font-weight:600;padding:3px 8px;border-radius:4px;margin-top:4px}
.badge-ok{background:var(--pos-soft);color:var(--pos)}.badge-warn{background:var(--warn-soft);color:var(--warn)}.badge-bad{background:var(--neg-soft);color:var(--neg)}
.quick-links{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
.quick-link{border:1px solid var(--card-brd);background:var(--card);border-radius:8px;padding:12px 8px;text-align:center;cursor:pointer;font-size:11px;font-weight:600;color:var(--txt2);box-shadow:var(--shadow)}
.quick-link strong{display:block;font-size:13px;color:var(--txt);margin-bottom:2px;font-weight:700}
.goal-card,.budget-card{border:1px solid var(--card-brd);border-radius:var(--r);padding:14px;margin-bottom:10px;background:var(--card);box-shadow:var(--shadow)}
.goal-card-h,.budget-card-h{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;margin-bottom:10px}
.goal-card-h h4,.budget-card-h h4{font-size:14px;font-weight:700}
.report-table{width:100%;border-collapse:collapse;font-size:13px}
.report-table th,.report-table td{padding:10px 8px;border-bottom:1px solid var(--card-brd);text-align:left}
.report-table th{font-size:11px;text-transform:uppercase;color:var(--txt3);font-weight:600}
.report-table td.num{text-align:right;font-weight:600}
.more-section{padding:8px 0 4px}.more-section-t{font-size:11px;font-weight:600;color:var(--txt3);text-transform:uppercase;letter-spacing:.04em;padding:8px 4px 4px}
.more-item{display:flex;align-items:center;gap:13px;padding:15px 4px;border-bottom:1px solid var(--card-brd);cursor:pointer;font-size:14px;font-weight:600}
.more-item:last-child{border-bottom:0}
.more-item .mi{width:38px;height:38px;border-radius:8px;background:var(--bg);display:flex;align-items:center;justify-content:center;font-size:18px;border:1px solid var(--card-brd)}

/* Entrada rápida: foto / voz / OCR */
.qi-row{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.qi-btn{border:1px solid var(--card-brd);background:var(--card);color:var(--txt);font-weight:600;font-size:12px;padding:12px 10px;border-radius:8px;cursor:pointer;font-family:inherit;transition:.15s;display:flex;align-items:center;justify-content:center;gap:6px}
.qi-btn:active{transform:scale(.98)}
.qi-btn:disabled{opacity:.45;cursor:not-allowed}
.qi-btn-voice{background:var(--brand-soft);border-color:#bfdbfe;color:var(--brand)}
.qi-btn-photo{background:var(--pos-soft);border-color:#a7f3d0;color:var(--pos)}
.qi-btn.recording{animation:pulse-voice 1s infinite;border-color:var(--neg)}
@keyframes pulse-voice{0%,100%{box-shadow:0 0 0 0 rgba(251,113,133,.35)}50%{box-shadow:0 0 0 8px rgba(251,113,133,0)}}
.qi-status{font-size:11px;color:var(--txt3);font-weight:600;margin-bottom:12px;line-height:1.45;min-height:1.2em}
.qi-status.ok{color:var(--pos)}.qi-status.err{color:var(--neg)}.qi-status.busy{color:var(--brand)}
.ocr-bar{height:4px;border-radius:999px;background:var(--bg);overflow:hidden;margin-top:6px;border:1px solid var(--card-brd)}
.ocr-bar i{display:block;height:100%;background:var(--brand);width:0;transition:width .25s}
.receipt-scan-summary{background:rgba(52,211,153,.08);border:1px solid rgba(52,211,153,.22);border-radius:12px;padding:10px 12px;margin-bottom:12px}
.receipt-scan-summary.hidden{display:none}
.receipt-scan-title{font-size:11px;font-weight:800;color:var(--pos);margin-bottom:6px}
.receipt-scan-tags{display:flex;flex-wrap:wrap;gap:5px}
.receipt-scan-tag{font-size:10px;font-weight:700;background:var(--bg);padding:4px 8px;border-radius:4px;color:var(--txt2);border:1px solid var(--card-brd)}
.receipt-scan-tag b{color:var(--txt);font-weight:800}
.receipt-toggle{width:100%;display:flex;align-items:center;justify-content:space-between;gap:8px;border:1px solid var(--card-brd);background:var(--bg);color:var(--txt);font-weight:600;font-size:12px;padding:11px 12px;border-radius:8px;cursor:pointer;font-family:inherit;margin-bottom:10px}
.receipt-toggle span:last-child{font-size:10px;color:var(--txt3);font-weight:600}
.receipt-body{display:none;margin-bottom:4px}
.receipt-body.open{display:block}
.receipt-grid{display:grid;gap:10px;grid-template-columns:1fr}
@media(min-width:520px){.receipt-grid{grid-template-columns:1fr 1fr}}
.receipt-grid .full{grid-column:1/-1}

.d1,.d2,.d3,.d4{animation:none}

/* ── Tablet (768px+) ── */
@media (min-width:768px){
  .main{padding:0 1.5rem 2rem}
  .top{padding-top:1.25rem}
  .page-title{font-size:1.75rem}
  .home-grid{grid-template-columns:1.15fr 1fr;grid-template-areas:"hero stats" "cashflow cashflow" "cats recent"}
  .home-hero{grid-area:hero}
  .home-stats{grid-area:stats;align-self:stretch}
  .home-cashflow{grid-area:cashflow}
  .home-bottom{grid-column:1/-1;display:grid;grid-template-columns:1fr 1fr;grid-template-areas:"cats recent"}
  .home-cats{grid-area:cats}
  .home-recent{grid-area:recent}
  .home-bottom .sec{margin-bottom:0}
  .home-stats.trio{grid-template-columns:1fr;gap:8px;height:100%;align-content:stretch}
  .home-stats .stat{display:flex;align-items:center;gap:12px;padding:12px 14px}
  .home-stats .stat .ic{margin-bottom:0;flex-shrink:0}
  .home-stats .stat .k,.home-stats .stat .v{flex:1}
  .home-stats .stat .v{text-align:right}
  .grid-2{grid-template-columns:1fr 1fr}
  .accounts-grid{grid-template-columns:1fr 1fr}
  .nav{position:sticky;top:0;align-self:flex-start;width:var(--sidebar-w);min-width:var(--sidebar-w);height:100vh;flex-direction:column;align-items:stretch;justify-content:flex-start;padding:0;border-top:0;border-right:1px solid var(--card-brd);border-bottom:0;padding-bottom:1rem}
  .sidebar-brand{display:block}
  .nav button{flex:none;flex-direction:row;justify-content:flex-start;gap:.75rem;padding:.75rem 1rem;margin:.15rem .65rem;border-radius:.75rem;font-size:.8125rem;width:calc(100% - 1.3rem)}
  .nav button:hover{background:var(--bg)}
  .nav button.on{background:var(--brand-soft);color:var(--brand)}
  .nav .plus{order:10;margin-top:auto;padding:0 .65rem;width:100%;justify-content:flex-start;gap:.65rem}
  .nav .plus b{width:2rem;height:2rem;border-radius:8px;margin-top:0;font-size:1.1rem;border:0;box-shadow:var(--shadow)}
  .plus-lbl{display:block;font-size:.8125rem;font-weight:700;color:var(--txt)}
  .nav-spacer{display:block;flex:1}
  .nav .nav-spacer{flex:1}
  .shell{align-items:stretch}
}

/* ── Notebook / Desktop (1024px+) ── */
@media (min-width:1024px){
  .main{padding:0 2rem 2.5rem}
  .hi b{font-size:1.35rem}
  .home-grid{grid-template-columns:1fr 1.05fr;grid-template-areas:"hero cashflow" "stats cashflow" "cats recent"}
  .home-hero{grid-area:hero}
  .home-stats{grid-area:stats}
  .home-cashflow{grid-area:cashflow}
  .home-bottom{display:contents}
  .home-cats{grid-area:cats}
  .home-recent{grid-area:recent}
  .sec{padding:1.35rem 1.5rem}
  .tx{padding:13px 0}
  .tx:hover{background:var(--bg);margin:0 -.5rem;padding-left:.5rem;padding-right:.5rem;border-radius:8px}
  .acc-row:hover{border-color:rgba(124,123,255,.25);transform:translateY(-1px)}
  .sheet-bg.open{display:flex;align-items:center;justify-content:center;padding:1rem}
  .sheet{position:relative;border-radius:var(--r);border:1px solid var(--card-brd);max-height:85vh;transform:scale(.96);opacity:0}
  .sheet.open{transform:scale(1);opacity:1}
}

/* ── Mobile ── */
@media (max-width:767px){
  .shell{flex-direction:column}
  .nav{position:fixed;left:0;right:0;bottom:0;padding:8px 10px calc(10px + env(safe-area-inset-bottom))}
  .main{padding:0 1rem calc(120px + env(safe-area-inset-bottom)) 1rem}
  .sec{margin-bottom:14px}
  .hero{margin-bottom:0}
  .home-bottom .sec{margin-bottom:14px}
}
</style>
</head>
<body>

<div class="shell">
  <nav class="nav" id="nav"></nav>
  <div class="main">
    <div class="main-inner">
      <div id="top"></div>
      <div id="app"></div>
    </div>
  </div>
</div>

<div class="sheet-bg" id="sheet-bg"></div>
<div class="sheet" id="sheet"></div>

<script src="js/voice-input.js?v=11"></script>
<script src="js/receipt-scanner.js?v=11"></script>
<script>
/* ─────────── Data layer (compatível com o app clássico) ─────────── */
const K={acc:'app_accounts_v3',card:'app_creditCards_v3',tx:'app_transactions_v3',cat:'app_categories_v3',budg:'app_budgets_v3',goals:'financial_goals_v2'};
const load=k=>{try{return JSON.parse(localStorage.getItem(k))||[]}catch(e){return[]}};
const save=(k,v)=>localStorage.setItem(k,JSON.stringify(v));
const BRL=v=>new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'}).format(v||0);
const kk=v=>{const s=Math.abs(v)>=1000?(v/1000).toFixed(Math.abs(v)>=10000?0:1).replace('.0','')+'k':Math.round(Math.abs(v));return(v<0?'−R$ ':'R$ ')+s};
const startDay=d=>{const x=new Date(d);x.setHours(0,0,0,0);return x};
const iso=d=>{const x=startDay(d);return x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0')};
const parseD=s=>startDay(new Date(String(s).slice(0,10)+'T00:00:00'));
const uid=()=>(crypto.randomUUID?crypto.randomUUID():'id'+Date.now()+Math.random().toString(16).slice(2));
const DEF_CATS=["Alimentação","Transporte","Moradia","Lazer","Saúde","Educação","Salário","Investimentos","Contas Fixas","Compras","Pagamento de Fatura","Outros"];
const CAT_EMOJI={'Alimentação':'🍽️','Transporte':'🚗','Moradia':'🏠','Saúde':'💊','Lazer':'🎬','Educação':'📚','Compras':'🛍️','Contas Fixas':'📄','Salário':'💰','Investimentos':'📈','Pagamento de Fatura':'💳','Outros':'✨'};
const emojiFor=c=>CAT_EMOJI[c]||'✨';

let S={accounts:[],cards:[],txs:[],cats:[],budgets:[],goals:[],hide:false,cfDays:30,view:'home'};

function persist(){save(K.tx,S.txs);save(K.acc,S.accounts);save(K.card,S.cards);save(K.budg,S.budgets);save(K.goals,S.goals)}
function recompute(){
  S.accounts.forEach(a=>{let b=a.initialBalance||0;
    S.txs.filter(t=>t.accountId===a.id&&!t.isCreditCard).forEach(t=>{
      if(t.fundamentalType==='receita')b+=t.value;
      else if(t.fundamentalType==='despesa'&&t.isPaid&&t.paidByAccountId===a.id)b-=t.value;});
    a.balance=b;});
  S.cards.forEach(c=>{let u=0;S.txs.filter(t=>t.accountId===c.id&&t.isCreditCard).forEach(t=>{u+=t.fundamentalType==='despesa'?t.value:-t.value});c.availableLimit=(c.limit||0)-Math.max(0,u)});
}
const totalBalance=()=>S.accounts.reduce((s,a)=>s+(a.balance||0),0);
const cardDebt=()=>S.cards.reduce((s,c)=>s+Math.max(0,(c.limit||0)-(c.availableLimit||0)),0);
const netWorth=()=>totalBalance()-cardDebt();
const nameById=id=>{const a=S.accounts.find(x=>x.id===id)||S.cards.find(x=>x.id===id);return a?a.name:'Sem conta'};
function monthAgg(off=0){const now=new Date();const d=new Date(now.getFullYear(),now.getMonth()-off,1);const pm=d.getMonth(),py=d.getFullYear();
  const t=S.txs.filter(x=>{const dd=parseD(x.date);return dd.getMonth()===pm&&dd.getFullYear()===py});
  return{income:t.filter(x=>x.fundamentalType==='receita').reduce((s,x)=>s+x.value,0),expense:t.filter(x=>x.fundamentalType==='despesa').reduce((s,x)=>s+x.value,0)}}

/* Live cash flow */
function project(days){
  const today=startDay(new Date());const hz=new Date(today);hz.setDate(hz.getDate()+days);
  let start=totalBalance();
  const futInc=S.txs.filter(t=>t.fundamentalType==='receita'&&parseD(t.date)>today);start-=futInc.reduce((s,t)=>s+t.value,0);
  const overdue=S.txs.filter(t=>t.fundamentalType==='despesa'&&!t.isCreditCard&&!t.isPaid&&parseD(t.date)<today);const ovSum=overdue.reduce((s,t)=>s+t.value,0);
  const ev={};const add=(dt,a)=>{let d=startDay(dt);if(d<today)d=new Date(today);if(d>hz)return;(ev[iso(d)]=ev[iso(d)]||[]).push(a)};
  futInc.forEach(t=>add(parseD(t.date),+t.value));
  S.txs.filter(t=>t.fundamentalType==='despesa'&&!t.isCreditCard&&!t.isPaid&&parseD(t.date)>=today).forEach(t=>add(parseD(t.date),-t.value));
  if(ovSum>0)add(new Date(today),-ovSum);
  S.cards.forEach(c=>{const u=Math.max(0,(c.limit||0)-(c.availableLimit||0));if(u<=0||!c.dueDay)return;let due=new Date(today.getFullYear(),today.getMonth(),c.dueDay);if(due<today)due=new Date(today.getFullYear(),today.getMonth()+1,c.dueDay);if(due<=hz)add(due,-u)});
  const pts=[];let run=start,low={d:new Date(today),b:run},breach=null;
  for(let i=0;i<=days;i++){const d=new Date(today);d.setDate(d.getDate()+i);const evs=ev[iso(d)]||[];run+=evs.reduce((s,a)=>s+a,0);run=Math.round(run*100)/100;pts.push({d:new Date(d),b:run});if(run<low.b)low={d:new Date(d),b:run};if(!breach&&run<0)breach={d:new Date(d),b:run}}
  return{today,days,start:Math.round(start*100)/100,end:pts[pts.length-1].b,pts,low,breach}}
function insight(p){const f=v=>BRL(Math.abs(v));
  if(p.breach){const dd=Math.round((p.breach.d-p.today)/864e5);const q=dd<=0?'hoje':dd===1?'amanhã':`em ${dd} dias (${p.breach.d.toLocaleDateString('pt-BR')})`;
    return{lvl:'bad',t:'Risco de saldo negativo',m:`Nesse ritmo, seu saldo fica negativo ${q}. Faltam ${f(p.breach.b)}. Considere adiar gastos ou antecipar uma entrada.`}}
  if(p.low.b<300)return{lvl:'warn',t:'Mês apertado',m:`Seu ponto mais baixo será ${f(p.low.b)} em ${p.low.d.toLocaleDateString('pt-BR')}. Segure os supérfluos.`};
  return{lvl:'good',t:'Tudo sob controle',m:`Projeção saudável: você fecha o período com cerca de ${f(p.end)}.`}}
function areaSVG(vals,w,h,pad){pad=pad||6;const min=Math.min(...vals,0),max=Math.max(...vals,0);const rng=(max-min)||1;
  const X=i=>pad+i*((w-2*pad)/((vals.length-1)||1));const Y=v=>pad+(1-(v-min)/rng)*(h-2*pad);
  let line=vals.map((v,i)=>(i?'L':'M')+X(i).toFixed(1)+' '+Y(v).toFixed(1)).join(' ');
  const area=line+` L ${X(vals.length-1).toFixed(1)} ${(h-pad).toFixed(1)} L ${X(0).toFixed(1)} ${(h-pad).toFixed(1)} Z`;
  return{line,area,zeroY:min<0?Y(0):null,X,Y}}
const chartW=(ratio=.88)=>Math.min(Math.max(Math.floor((window.innerWidth>=1024?window.innerWidth*.38:window.innerWidth*ratio)-32),280),960);

/* ─────────── Top bar ─────────── */
function spentInCategory(cat,off=0){const now=new Date();const m=new Date(now.getFullYear(),now.getMonth()-off,1);
  return S.txs.filter(t=>{const d=parseD(t.date);return t.fundamentalType==='despesa'&&t.category===cat&&d.getMonth()===m.getMonth()&&d.getFullYear()===m.getFullYear()}).reduce((s,t)=>s+t.value,0)}
function budgetStatus(spent,limit){const p=limit>0?spent/limit*100:0;if(p>100)return'bad';if(p>75)return'warn';return'ok'}
function budgetBadge(st){return st==='bad'?'<span class="badge badge-bad">Estourado</span>':st==='warn'?'<span class="badge badge-warn">Atenção</span>':'<span class="badge badge-ok">No limite</span>'}
function renderTop(){
  const h=new Date().getHours();const greet=h<12?'Bom dia':h<18?'Boa tarde':'Boa noite';
  let name='Bem-vindo',ini='FL';
  try{const u=JSON.parse(localStorage.getItem('auth_user')||'null');if(u&&u.name){name=u.name.split(' ')[0];ini=u.name.split(' ').slice(0,2).map(w=>w[0]).join('').toUpperCase()}}catch(e){}
  document.getElementById('top').innerHTML=`<div class="top">
    <div class="hi">${greet}<b>${name}</b></div>
    <div class="top-actions"><div class="ava">${ini}</div></div></div>`;
}

/* ─────────── Nav ─────────── */
function renderNav(){
  const items=[
    ['home','Início','M3 12l9-9 9 9M5 10v10a1 1 0 001 1h3v-6h6v6h3a1 1 0 001-1V10'],
    ['tx','Transações','M4 6h16M4 12h16M4 18h10'],
    ['budgets','Orçamentos','M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z'],
    ['plus','',''],
    ['accounts','Contas','M3 10h18M7 15h4M3 6h18v12H3z'],
    ['more','Mais','M4 6h16M4 12h16M4 18h16'],
  ];
  let html='<div class="sidebar-brand">Finanças+<span>Controle financeiro pessoal</span></div>';
  items.forEach(([v,l,d])=>{
    if(v==='plus'){html+=`<div class="nav-spacer"></div><button class="plus" onclick="openTxSheet()"><b>＋</b><span class="plus-lbl">Novo lançamento</span></button>`;return}
    html+=`<button class="${S.view===v?'on':''}" onclick="go('${v}')"><svg viewBox="0 0 24 24"><path d="${d}" stroke-linecap="round" stroke-linejoin="round"/></svg><span>${l}</span></button>`;
  });
  document.getElementById('nav').innerHTML=html;
}
function go(v){S.view=v;render()}

/* ─────────── Render router ─────────── */
function render(){recompute();renderTop();renderNav();
  const app=document.getElementById('app');
  if(S.view==='home')app.innerHTML=viewHome();
  else if(S.view==='tx')app.innerHTML=viewTx();
  else if(S.view==='budgets')app.innerHTML=viewBudgets();
  else if(S.view==='goals')app.innerHTML=viewGoals();
  else if(S.view==='reports')app.innerHTML=viewReports();
  else if(S.view==='accounts')app.innerHTML=viewAccounts();
  else if(S.view==='more')app.innerHTML=viewMore();
  postRender();
}
function postRender(){
  requestAnimationFrame(()=>document.querySelectorAll('.bar i,.progress i').forEach(i=>{if(i.dataset.w)i.style.width=i.dataset.w+'%'}));
  const eye=document.getElementById('eye');if(eye)eye.onclick=()=>{S.hide=!S.hide;render()};
  document.querySelectorAll('#cf-seg button').forEach(b=>b.onclick=()=>{S.cfDays=+b.dataset.d;render()});
}

/* ─────────── HOME ─────────── */
function viewHome(){
  if(!S.accounts.length)return emptyState('','Comece por aqui','Crie sua primeira conta em <b>Contas</b> para ver o painel completo.');
  const nw=netWorth(),cur=monthAgg(0),bal=totalBalance();
  const prevNw=nw-(cur.income-cur.expense);const dPct=prevNw!==0?((nw-prevNw)/Math.abs(prevNw)*100):0;
  const spark=[];let acc=nw;spark.unshift(acc);for(let i=0;i<5;i++){const a=monthAgg(i);acc-=(a.income-a.expense);spark.unshift(acc)}
  const sw=chartW(.55),sh=44,sp=areaSVG(spark,sw,sh);
  const p=project(S.cfDays),ins=insight(p),cw=chartW(.38),ch=Math.min(220,Math.max(150,window.innerWidth*0.18)),cv=p.pts.map(x=>x.b),ca=areaSVG(cv,cw,ch,10);
  const bIdx=p.breach?p.pts.findIndex(x=>iso(x.d)===iso(p.breach.d)):-1;
  const now=new Date();const mtx=S.txs.filter(t=>{const d=parseD(t.date);return t.fundamentalType==='despesa'&&d.getMonth()===now.getMonth()&&d.getFullYear()===now.getFullYear()});
  const byCat={};mtx.forEach(t=>byCat[t.category||'Outros']=(byCat[t.category||'Outros']||0)+t.value);
  const cats=Object.entries(byCat).sort((a,b)=>b[1]-a[1]).slice(0,5);const maxCat=cats.length?cats[0][1]:1;
  const recent=[...S.txs].sort((a,b)=>parseD(b.date)-parseD(a.date)).slice(0,5);
  const hv=v=>S.hide?'•••••':BRL(v);
  const budgetHtml=S.budgets.length?S.budgets.slice(0,4).map(b=>{const sp=spentInCategory(b.category);const st=budgetStatus(sp,b.amount);const pct=Math.min(100,b.amount?sp/b.amount*100:0);
    return `<div class="cat"><div class="cat-top"><div class="cat-name">${esc(b.category)} ${budgetBadge(st)}</div><div class="cat-val num">${BRL(sp)} / ${BRL(b.amount)}</div></div><div class="bar"><i data-w="${Math.max(4,pct)}" style="background:${st==='bad'?'var(--neg)':st==='warn'?'var(--warn)':'var(--brand)'}"></i></div></div>`}).join(''):'<p style="color:var(--txt3);font-size:13px">Nenhum orçamento definido. <a href="#" onclick="go(\'budgets\');return false" style="color:var(--brand)">Criar orçamento</a></p>';
  return `
  <div class="quick-links">
    <div class="quick-link" onclick="go('budgets')"><strong>Orçamentos</strong>${S.budgets.length} ativo(s)</div>
    <div class="quick-link" onclick="go('goals')"><strong>Metas</strong>${S.goals.length} meta(s)</div>
    <div class="quick-link" onclick="go('reports')"><strong>Relatórios</strong>Ver histórico</div>
  </div>
  <div class="home-grid">
  <div class="summary-card home-hero"><div class="summary-lbl">Patrimônio líquido <span class="eye" id="eye" title="Ocultar valores">${S.hide?'Mostrar':'Ocultar'}</span></div>
    <div class="summary-val num">${hv(nw)}</div>
    <div class="summary-delta ${dPct>=0?'up':'down'}">${dPct>=0?'▲':'▼'} ${Math.abs(dPct).toFixed(1)}% em relação ao mês passado</div>
    <div class="hero-spark"><svg width="100%" height="${sh}" viewBox="0 0 ${sw} ${sh}" preserveAspectRatio="none">
      <path d="${sp.area}" fill="var(--brand-soft)"/><path d="${sp.line}" fill="none" stroke="var(--brand)" stroke-width="2" stroke-linejoin="round"/></svg></div></div>
  <div class="trio home-stats">
    <div class="stat"><div class="ic">Saldo</div><div class="k">Contas</div><div class="v num">${hv(bal)}</div></div>
    <div class="stat"><div class="ic" style="color:var(--pos)">+</div><div class="k">Entradas</div><div class="v num" style="color:var(--pos)">${hv(cur.income)}</div></div>
    <div class="stat"><div class="ic" style="color:var(--neg)">−</div><div class="k">Saídas</div><div class="v num" style="color:var(--neg)">${hv(cur.expense)}</div></div></div>
  <div class="sec home-cashflow"><div class="sec-h"><div><div class="sec-t">Projeção de saldo</div><div class="sec-sub">Próximos ${S.cfDays} dias</div></div>
      <div class="seg" id="cf-seg">${[30,60,90].map(d=>`<button data-d="${d}" class="${S.cfDays===d?'on':''}">${d}d</button>`).join('')}</div></div>
    <div class="insight ins-${ins.lvl}"><div class="dot"></div><div><div class="it">${ins.t}</div><div class="im">${ins.m}</div></div></div>
    <div class="cf-chart"><svg viewBox="0 0 ${cw} ${ch}" preserveAspectRatio="none">
      ${ca.zeroY!=null?`<line x1="0" y1="${ca.zeroY.toFixed(1)}" x2="${cw}" y2="${ca.zeroY.toFixed(1)}" stroke="#fecaca" stroke-width="1" stroke-dasharray="4 4"/>`:''}
      <path d="${ca.area}" fill="var(--brand-soft)"/><path d="${ca.line}" fill="none" stroke="${p.breach?'var(--neg)':'var(--brand)'}" stroke-width="2" stroke-linejoin="round"/>
      ${bIdx>=0?`<circle cx="${ca.X(bIdx).toFixed(1)}" cy="${ca.Y(cv[bIdx]).toFixed(1)}" r="4" fill="var(--neg)"/>`:''}</svg></div>
    <div class="cf-metrics"><div class="cf-m"><div class="k">Hoje</div><div class="v num">${kk(p.start)}</div></div>
      <div class="cf-m"><div class="k">Ponto baixo</div><div class="v num" style="color:${p.low.b<0?'var(--neg)':'var(--txt)'}">${kk(p.low.b)}</div></div>
      <div class="cf-m"><div class="k">Projetado</div><div class="v num" style="color:${p.end<0?'var(--neg)':'var(--pos)'}">${kk(p.end)}</div></div></div></div>
  <div class="home-bottom">
  <div class="sec home-cats"><div class="sec-h"><div class="sec-t">Orçamento do mês</div><div class="sec-sub" style="cursor:pointer" onclick="go('budgets')">gerenciar →</div></div>${budgetHtml}</div>
  <div class="sec home-cats"><div class="sec-h"><div class="sec-t">Gastos por categoria</div><div class="sec-sub">${now.toLocaleDateString('pt-BR',{month:'long'})}</div></div>
    ${cats.length?cats.map(([c,v])=>`<div class="cat"><div class="cat-top"><div class="cat-name">${esc(c)}</div><div class="cat-val num">${hv(v)}</div></div><div class="bar"><i data-w="${Math.max(6,v/maxCat*100)}"></i></div></div>`).join(''):'<p style="color:var(--txt3);font-size:13px">Sem despesas neste mês.</p>'}</div>
  <div class="sec home-recent"><div class="sec-h"><div class="sec-t">Últimos lançamentos</div><div class="sec-sub" style="cursor:pointer" onclick="go('tx')">ver todos →</div></div>
    ${recent.length?recent.map(txRow).join(''):'<p style="color:var(--txt3);font-size:13px">Nenhum lançamento. Use o botão + para adicionar.</p>'}</div>
  </div></div>`;
}
function txRow(t){const inc=t.fundamentalType==='receita';
  return `<div class="tx" onclick="openTxSheet('${t.id}')"><div class="tx-ic" style="background:${inc?'var(--pos-soft)':'var(--neg-soft)'};color:${inc?'var(--pos)':'var(--neg)'};font-size:12px;font-weight:700">${inc?'+':'−'}</div>
    <div class="tx-mid"><div class="tx-d">${esc(t.description||t.category||'Lançamento')}</div><div class="tx-s">${parseD(t.date).toLocaleDateString('pt-BR',{day:'2-digit',month:'short'})} · ${esc(nameById(t.accountId))}${t.isPaid?'':' · <span style="color:var(--warn)">a pagar</span>'}</div></div>
    <div class="tx-v num" style="color:${inc?'var(--pos)':'var(--neg)'}">${inc?'+':'−'}${S.hide?'•••':BRL(t.value)}</div></div>`}
const esc=s=>String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');

/* ─────────── TRANSAÇÕES ─────────── */
let txFilterOffset=0;
function viewTx(){
  const now=new Date();const d=new Date(now.getFullYear(),now.getMonth()-txFilterOffset,1);const m=d.getMonth(),y=d.getFullYear();
  const list=S.txs.filter(t=>{const dd=parseD(t.date);return dd.getMonth()===m&&dd.getFullYear()===y}).sort((a,b)=>parseD(b.date)-parseD(a.date));
  const inc=list.filter(t=>t.fundamentalType==='receita').reduce((s,t)=>s+t.value,0);
  const exp=list.filter(t=>t.fundamentalType==='despesa').reduce((s,t)=>s+t.value,0);
  let html=`<div class="page-title">Transações</div><div class="grid-2">`;
  html+=`<div class="sec"><div class="sec-h">
      <button class="chip-link" onclick="txFilterOffset++;render()">‹</button>
      <div style="text-align:center"><div class="sec-t" style="text-transform:capitalize">${d.toLocaleDateString('pt-BR',{month:'long',year:'numeric'})}</div></div>
      <button class="chip-link" onclick="if(txFilterOffset>0){txFilterOffset--;render()}" style="opacity:${txFilterOffset>0?1:.35}">›</button></div>
      <div class="trio" style="margin:0"><div class="stat"><div class="k">Entradas</div><div class="v num" style="color:var(--pos)">${BRL(inc)}</div></div>
        <div class="stat"><div class="k">Saídas</div><div class="v num" style="color:var(--neg)">${BRL(exp)}</div></div>
        <div class="stat"><div class="k">Saldo</div><div class="v num" style="color:${inc-exp>=0?'var(--pos)':'var(--neg)'}">${kk(inc-exp)}</div></div></div></div>`;
  if(!list.length)return html+emptyState('','Nenhuma transação','Não há lançamentos neste mês.')+'</div>';
  let lastDay='';html+='<div class="sec">';
  list.forEach(t=>{const dl=parseD(t.date).toLocaleDateString('pt-BR',{weekday:'long',day:'2-digit',month:'long'});
    if(dl!==lastDay){html+=`<div class="date-h">${dl}</div>`;lastDay=dl}html+=txRow(t)});
  html+='</div></div>';return html;
}

/* ─────────── CONTAS / CARTÕES ─────────── */
function viewAccounts(){
  let html=`<div class="page-title">Contas & Cartões</div><div class="accounts-grid">`;
  html+=`<div class="sec"><div class="sec-h"><div class="sec-t">Minhas contas</div><div class="sec-sub num">${BRL(totalBalance())}</div></div>`;
  html+= S.accounts.length? S.accounts.map(a=>`<div class="acc-row" onclick="openAccSheet('${a.id}')">
      <div class="acc-ic">${a.type==='dinheiro'?'💵':a.type==='poupanca'?'🐷':a.type==='investimento'?'📈':'🏦'}</div>
      <div class="acc-mid"><div class="acc-n">${esc(a.name)}</div><div class="acc-t" style="text-transform:capitalize">${esc(a.type||'conta')}</div></div>
      <div class="acc-v num" style="color:${(a.balance||0)>=0?'var(--txt)':'var(--neg)'}">${BRL(a.balance||0)}</div></div>`).join('')
    :'<div class="empty"><div class="e">🏦</div><p>Nenhuma conta ainda.</p></div>';
  html+=`<button class="add-btn" onclick="openAccSheet()">＋ Nova conta</button></div>`;
  html+=`<div class="sec"><div class="sec-h"><div class="sec-t">Cartões de crédito</div><div class="sec-sub num" style="color:var(--neg)">${BRL(cardDebt())} em uso</div></div>`;

const TransactionFormFill={
  _set(id,v){const el=document.getElementById(id);if(el&&v!=null&&v!=='')el.value=v},
  _setSel(id,v){const el=document.getElementById(id);if(el&&v&&[...el.options].some(o=>o.value===v))el.value=v},
  apply(data={},opts={}){
    if(!data||typeof data!=='object')return;
    const desc=data.merchant||data.description;
    if(desc)this._set('in-desc',desc);
    if(data.value!=null&&data.value!==''&&!isNaN(Number(data.value)))this._set('in-val',Number(data.value));
    if(data.date)this._set('in-date',data.date);
    if(data.category)this._setSel('in-cat',data.category);
    if(data.fundamentalType){addType=data.fundamentalType;syncTypeTog()}
    this._setSel('receipt-doc-type',data.docType);
    this._set('receipt-beneficiary',data.beneficiary||data.merchant);
    this._set('receipt-cnpj',data.cnpj);this._set('receipt-cpf',data.cpf);
    this._set('receipt-nf-number',data.nfNumber);this._set('receipt-series',data.series);
    this._set('receipt-access-key',data.accessKey);this._set('receipt-time',data.time);
    this._set('receipt-pix-id',data.transactionId);this._set('receipt-due-date',data.dueDate||'');
    this._set('receipt-barcode',data.barcode);this._set('receipt-bank-auth',data.bankAuth);
    if(data.subtotal!=null&&!isNaN(Number(data.subtotal)))this._set('receipt-subtotal',Number(data.subtotal));
    if(data.discount!=null&&!isNaN(Number(data.discount)))this._set('receipt-discount',Number(data.discount));
    this._setSel('receipt-payment-method',data.paymentMethod);
    this._set('receipt-address',data.address);this._set('receipt-items',data.items);
    if(data.notes)this._set('receipt-notes',String(data.notes).slice(0,500));
    else if(data.rawText)this._set('receipt-notes',String(data.rawText).slice(0,500));
    if(opts.fromScan||data.fromScan){
      this._set('receipt-scanned-at',new Date().toISOString());
      document.getElementById('receipt-body')?.classList.add('open');
      ReceiptScanner._showScanSummary(data);
    }
  }
};

}

    cnpj:q('receipt-cnpj'),cpf:q('receipt-cpf'),nfNumber:q('receipt-nf-number'),series:q('receipt-series'),

function bindTxSheetQuickInput(){
  const voiceBtn=document.getElementById('qi-voice-btn');
  const photoBtn=document.getElementById('qi-photo-btn');
  const photoInput=document.getElementById('qi-photo-input');
  document.getElementById('receipt-toggle')?.addEventListener('click',()=>document.getElementById('receipt-body')?.classList.toggle('open'));
  if(voiceBtn){
    if(!VoiceInput.isSupported()){voiceBtn.disabled=true;voiceBtn.title=VoiceInput.unsupportedMessage()}
    else voiceBtn.onclick=()=>{
      if(VoiceInput.isListening){VoiceInput.stop();return}
      voiceBtn.classList.add('recording');setQiStatus('🎤 Ouvindo… fale o lançamento','busy');
      VoiceInput.start((transcript,parsed)=>{
        TransactionFormFill.apply(parsed);
        setQiStatus('✓ "'+transcript+'"','ok');
        voiceBtn.classList.remove('recording');
      },err=>{setQiStatus(err,'err');voiceBtn.classList.remove('recording')},
      ()=>voiceBtn.classList.remove('recording'));
    };
  }
  if(photoBtn&&photoInput){
    photoBtn.onclick=()=>photoInput.click();
    photoInput.onchange=async e=>{
      const file=e.target.files[0];if(!file)return;
      photoBtn.disabled=true;setQiStatus('📷 Preparando leitor…','busy');
      try{
        if(typeof ReceiptScanner==='undefined')throw new Error('Leitor OCR não carregou. Recarregue a página.');
        const result=await ReceiptScanner.scanFile(file,(pct,msg)=>{
          const st=document.getElementById('qi-status');
          if(st)st.innerHTML=`<span class="busy">📷 ${msg} (${pct}%)</span><div class="ocr-bar"><i style="width:${pct}%"></i></div>`;
        });
        ReceiptScanner.fillTransactionForm=ReceiptScanner.fillTransactionForm||function(p){applyScanResult(p)};
        applyScanResult({...result,fundamentalType:'despesa',category:result.category||'Outros'});
        const typeLabel=(ReceiptScanner.DOC_TYPES&&ReceiptScanner.DOC_TYPES[result.docType])||'Comprovante';
        const ok=result.value||result.description||result.cnpj||result.accessKey||result.transactionId||result.barcode||result.beneficiary;
        setQiStatus(ok?`✓ ${typeLabel}: ${result.description||'lido'}${result.value?' — '+BRL(result.value):''}. Confira os campos.`:'Leitura parcial. Complete manualmente.',ok?'ok':'err');
      }catch(err){
        console.error('[OCR]',err);
        setQiStatus(err.message||'Erro ao ler imagem. Tente JPG/PNG ou print da tela.','err');
      }
      finally{photoBtn.disabled=false;photoInput.value=''}
    };
    if(txSheetFlags.photo)setTimeout(()=>photoInput.click(),350);
    if(txSheetFlags.photo)txSheetFlags.photo=false;
  }
  if(txSheetFlags.voice){txSheetFlags.voice=false;setTimeout(()=>voiceBtn?.click(),400)}
}

    <div class="fld"><label>Valor (R$)</label><input id="in-val" class="big-in num" type="number" inputmode="decimal" placeholder="0,00" value="${t?t.value:''}"></div>
    <div class="fld"><label>Descrição</label><input id="in-desc" type="text" placeholder="Ex: Mercado, Salário…" value="${t?esc(t.description||''):''}"></div>
    <div class="fld row2"><div><label>Conta</label><select id="in-acc">${accOptions(t?t.accountId:'')}</select></div>
      <div><label>Categoria</label><select id="in-cat">${catOptions(t?t.category:'Outros')}</select></div></div>
    <div class="fld"><label>Data</label><input id="in-date" type="date" value="${t?iso(parseD(t.date)):iso(new Date())}"></div>
    ${receiptSectionHtml(r,receiptOpen)}
    <label class="chk"><input type="checkbox" id="in-paid" ${!t||t.isPaid?'checked':''}><span>Já foi pago / recebido</span></label>
    <button class="save" onclick="saveTx()">${t?'Salvar alterações':'Adicionar'}</button>`);
  document.querySelectorAll('#type-tog button').forEach(b=>b.onclick=()=>{addType=b.dataset.t;syncTypeTog()});
  bindTxSheetQuickInput();
  setTimeout(()=>document.getElementById('in-val').focus(),300);
}
function openTxSheetWithPhoto(){openTxSheet(null,{photo:true})}
function openTxSheetWithVoice(){openTxSheet(null,{voice:true})}
function saveTx(){
  const val=parseFloat(document.getElementById('in-val').value);if(!val||val<=0){document.getElementById('in-val').focus();return}
  const accId=document.getElementById('in-acc').value;const isCard=S.cards.some(c=>c.id===accId);
  const paid=document.getElementById('in-paid').checked;
  const receipt=collectReceiptFromSheet();
  const base={description:document.getElementById('in-desc').value||(addType==='receita'?'Receita':'Despesa'),
    value:val,date:document.getElementById('in-date').value||iso(new Date()),fundamentalType:addType,
    category:document.getElementById('in-cat').value||'Outros',accountId:accId||null,isCreditCard:isCard,
    isPaid:addType==='receita'?true:paid,
    paidByAccountId:(addType==='despesa'&&paid&&!isCard)?accId:null,paidByIsCreditCard:isCard};
  if(receipt){base.receipt=receipt;base.fromScan=!!receipt.scannedAt}
  if(editTxId){const t=S.txs.find(x=>x.id===editTxId);Object.assign(t,base)}
  else S.txs.push({id:uid(),installments:null,groupId:null,isRecurring:false,...base});
  persist();closeSheet();render();
}
function catOptions(sel){return S.cats.map(c=>`<option value="${esc(c)}" ${c===sel?'selected':''}>${esc(c)}</option>`).join('')}
function accOptions(sel){const a=S.accounts.map(x=>`<option value="${x.id}" ${x.id===sel?'selected':''}>${esc(x.name)}</option>`).join('');
  const c=S.cards.map(x=>`<option value="${x.id}" ${x.id===sel?'selected':''}>${esc(x.name)} (cartão)</option>`).join('');
  return `<option value="">Sem conta</option>${a?`<optgroup label="Contas">${a}</optgroup>`:''}${c?`<optgroup label="Cartões">${c}</optgroup>`:''}`}
function deleteTx(id){if(!confirm('Excluir este lançamento?'))return;S.txs=S.txs.filter(t=>t.id!==id);persist();closeSheet();render()}

function openAccSheet(id){const a=id?S.accounts.find(x=>x.id===id):null;
  openSheet(`<div class="sheet-head"><h3>${a?'Editar conta':'Nova conta'}</h3>${a?`<button class="del-btn" onclick="deleteAcc('${a.id}')">Excluir</button>`:''}</div>
    <div class="fld"><label>Nome</label><input id="ac-name" type="text" placeholder="Ex: Nubank, Carteira…" value="${a?esc(a.name):''}"></div>
    <div class="fld row2"><div><label>Tipo</label><select id="ac-type">
      ${['corrente','poupanca','dinheiro','investimento'].map(tp=>`<option value="${tp}" ${a&&a.type===tp?'selected':''}>${({corrente:'Conta corrente',poupanca:'Poupança',dinheiro:'Dinheiro',investimento:'Investimento'})[tp]}</option>`).join('')}
    </select></div><div><label>Saldo inicial (R$)</label><input id="ac-bal" type="number" inputmode="decimal" value="${a?(a.initialBalance||0):''}" placeholder="0,00"></div></div>
    <div class="fld"><label>Limite de cheque especial (R$)</label><input id="ac-over" type="number" inputmode="decimal" value="${a?(a.overdraftLimit||0):0}"></div>
    <button class="save" onclick="saveAcc()">${a?'Salvar':'Criar conta'}</button>`);
  document.getElementById('ac-name')&&setTimeout(()=>document.getElementById('ac-name').focus(),300);editAccId=id||null;
}
let editAccId=null;
function saveAcc(){const name=document.getElementById('ac-name').value.trim();if(!name){document.getElementById('ac-name').focus();return}
  const base={name,type:document.getElementById('ac-type').value,initialBalance:parseFloat(document.getElementById('ac-bal').value)||0,overdraftLimit:parseFloat(document.getElementById('ac-over').value)||0};
  if(editAccId){Object.assign(S.accounts.find(x=>x.id===editAccId),base)}else S.accounts.push({id:uid(),balance:base.initialBalance,...base});
  persist();closeSheet();render()}
function deleteAcc(id){const has=S.txs.some(t=>t.accountId===id);
  if(!confirm(has?'Esta conta tem lançamentos. Eles ficarão "Sem conta". Excluir mesmo assim?':'Excluir esta conta?'))return;
  S.txs.forEach(t=>{if(t.accountId===id){t.accountId=null;t.paidByAccountId=null}});
  S.accounts=S.accounts.filter(a=>a.id!==id);persist();closeSheet();render()}

function openCardSheet(id){const c=id?S.cards.find(x=>x.id===id):null;
  openSheet(`<div class="sheet-head"><h3>${c?'Editar cartão':'Novo cartão'}</h3>${c?`<button class="del-btn" onclick="deleteCard('${c.id}')">Excluir</button>`:''}</div>
    <div class="fld"><label>Nome do cartão</label><input id="cd-name" type="text" placeholder="Ex: Nubank Roxinho" value="${c?esc(c.name):''}"></div>
    <div class="fld row2"><div><label>Limite (R$)</label><input id="cd-limit" type="number" inputmode="decimal" value="${c?(c.limit||0):''}" placeholder="0,00"></div>
      <div><label>Dia do vencimento</label><input id="cd-due" type="number" min="1" max="31" value="${c?(c.dueDay||''):''}" placeholder="10"></div></div>
    <button class="save" onclick="saveCard()">${c?'Salvar':'Criar cartão'}</button>`);
  setTimeout(()=>document.getElementById('cd-name').focus(),300);editCardId=id||null}
let editCardId=null;
function saveCard(){const name=document.getElementById('cd-name').value.trim();if(!name){document.getElementById('cd-name').focus();return}
  const limit=parseFloat(document.getElementById('cd-limit').value)||0;const dueDay=parseInt(document.getElementById('cd-due').value)||null;
  if(editCardId){const c=S.cards.find(x=>x.id===editCardId);Object.assign(c,{name,limit,dueDay})}
  else S.cards.push({id:uid(),name,limit,dueDay,availableLimit:limit});
  persist();closeSheet();render()}
function deleteCard(id){if(!confirm('Excluir este cartão?'))return;S.txs.forEach(t=>{if(t.accountId===id&&t.isCreditCard){t.accountId=null}});S.cards=S.cards.filter(c=>c.id!==id);persist();closeSheet();render()}

/* ─────────── Init ─────────── */
function init(){
  if(window.location.hostname.includes('financasmais.com')&&!localStorage.getItem('auth_token')){
    location.href='classico.html';return;
  }
  S.accounts=load(K.acc);S.cards=load(K.card);S.txs=load(K.tx);S.budgets=load(K.budg);S.goals=load(K.goals);
  const c=load(K.cat);S.cats=(c&&c.length)?c:DEF_CATS.slice();
  render();
  window.addEventListener('resize',()=>{clearTimeout(window._rz);window._rz=setTimeout(render,200)});
}
window.go=go;window.openTxSheet=openTxSheet;window.openTxSheetWithPhoto=openTxSheetWithPhoto;window.openTxSheetWithVoice=openTxSheetWithVoice;window.saveTx=saveTx;window.deleteTx=deleteTx;
window.openAccSheet=openAccSheet;window.saveAcc=saveAcc;window.deleteAcc=deleteAcc;
window.openCardSheet=openCardSheet;window.saveCard=saveCard;window.deleteCard=deleteCard;
window.exportData=exportData;window.doLogout=doLogout;
init();
window.openBudgetSheet=openBudgetSheet;window.saveBudget=saveBudget;window.deleteBudget=deleteBudget;
window.openGoalSheet=openGoalSheet;window.saveGoal=saveGoal;window.deleteGoal=deleteGoal;
if('serviceWorker' in navigator){navigator.serviceWorker.register('/sw.js?v=12').then(r=>r.update()).catch(()=>{})}
</script>
</body>
</html>

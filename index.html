<body>

<div class="shell">
  <nav class="nav" id="nav"></nav>
  <div class="main">
    <div class="main-inner">
      <div id="top"></div>
      <div id="app"></div>
    </div>
  </div>
</div>

<div class="sheet-bg" id="sheet-bg"><div class="sheet" id="sheet"></div></div>
<input type="file" id="import-input" accept=".json,application/json" hidden>

<script src="js/csv-importer.js?v=1"></script>
<script src="js/ofx-importer.js?v=1"></script>
<script src="js/voice-input.js?v=11"></script>
<script src="js/receipt-scanner.js?v=13"></script>
<script src="js/receipt-store.js?v=1"></script>
<script src="js/finance-suite.js?v=1"></script>
<script>
/* ─────────── Data layer (compatível com o app clássico) ─────────── */
const K={acc:'app_accounts_v3',card:'app_creditCards_v3',tx:'app_transactions_v3',cat:'app_categories_v3',budg:'app_budgets_v3',goals:'financial_goals_v2'};
const load=k=>{try{return JSON.parse(localStorage.getItem(k))||[]}catch(e){return[]}};
const save=(k,v)=>localStorage.setItem(k,JSON.stringify(v));
const BRL=v=>new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'}).format(v||0);
const kk=v=>{const s=Math.abs(v)>=1000?(v/1000).toFixed(Math.abs(v)>=10000?0:1).replace('.0','')+'k':Math.round(Math.abs(v));return(v<0?'−R$ ':'R$ ')+s};
const startDay=d=>{const x=new Date(d);x.setHours(0,0,0,0);return x};
const iso=d=>{const x=startDay(d);return x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0')};
const parseD=s=>startDay(new Date(String(s).slice(0,10)+'T00:00:00'));
const uid=()=>(crypto.randomUUID?crypto.randomUUID():'id'+Date.now()+Math.random().toString(16).slice(2));
const DEF_CATS=["Alimentação","Transporte","Moradia","Lazer","Saúde","Educação","Salário","Investimentos","Contas Fixas","Compras","Pagamento de Fatura","Outros"];
const CAT_EMOJI={'Alimentação':'🍽️','Transporte':'🚗','Moradia':'🏠','Saúde':'💊','Lazer':'🎬','Educação':'📚','Compras':'🛍️','Contas Fixas':'📄','Salário':'💰','Investimentos':'📈','Pagamento de Fatura':'💳','Outros':'✨'};
const emojiFor=c=>CAT_EMOJI[c]||'✨';

const ICONS={
  wallet:'<svg viewBox="0 0 24 24"><path d="M21 12V7H5a2 2 0 010-4h14v4"/><path d="M3 5v14a2 2 0 002 2h16v-5"/><path d="M18 12a2 2 0 100 4h4v-4h-4z"/></svg>',
  chart:'<svg viewBox="0 0 24 24"><path d="M18 20V10M12 20V4M6 20v-6"/></svg>',
  target:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/></svg>',
  report:'<svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><path d="M14 2v6h6M16 13H8M16 17H8M10 9H8"/></svg>',
  camera:'<svg viewBox="0 0 24 24"><path d="M23 19a2 2 0 01-2 2H3a2 2 0 01-2-2V8a2 2 0 012-2h4l2-3h6l2 3h4a2 2 0 012 2z"/><circle cx="12" cy="13" r="4"/></svg>',
  mic:'<svg viewBox="0 0 24 24"><path d="M12 1a3 3 0 00-3 3v8a3 3 0 006 0V4a3 3 0 00-3-3z"/><path d="M19 10v2a7 7 0 01-14 0v-2M12 19v4M8 23h8"/></svg>',
  export:'<svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4M7 10l5 5 5-5M12 15V3"/></svg>',
  logout:'<svg viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4M16 17l5-5-5-5M21 12H9"/></svg>',
  plus:'<svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" stroke="currentColor" fill="none" stroke-width="2" stroke-linecap="round"/></svg>',
  clock:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>',
};
const ACC_STYLE={corrente:{l:'CC',bg:'#eff6ff',c:'#2563eb'},poupanca:{l:'PP',bg:'#ecfdf5',c:'#059669'},dinheiro:{l:'DH',bg:'#fffbeb',c:'#d97706'},investimento:{l:'IV',bg:'#f5f3ff',c:'#7c3aed'},cartao:{l:'CR',bg:'#fdf2f8',c:'#db2777'}};
function accIcon(type){const s=ACC_STYLE[type]||ACC_STYLE.corrente;return `<div class="acc-ic" style="background:${s.bg};color:${s.c}">${s.l}</div>`}
function catInitial(cat){return String(cat||'?').slice(0,2).toUpperCase()}
function catColor(cat){let h=0;for(let i=0;i<(cat||'').length;i++)h=(cat.charCodeAt(i)+h*31)%360;return `hsl(${h},55%,42%)`}
function catBg(cat){let h=0;for(let i=0;i<(cat||'').length;i++)h=(cat.charCodeAt(i)+h*31)%360;return `hsla(${h},55%,42%,.1)`}

let S={accounts:[],cards:[],txs:[],cats:[],budgets:[],goals:[],recurring:[],hide:false,cfDays:30,theme:'light',calendarMonth:0,view:'home',txFilters:{type:'all',cat:'',acc:'',status:'all',q:''},budgetFilter:'all',budgetSort:'status',budgetMonthOffset:0};

function persist(){save(K.tx,S.txs);save(K.acc,S.accounts);save(K.card,S.cards);save(K.budg,S.budgets);save(K.goals,S.goals);save(K.cat,S.cats);if(window.FinanceSuite)FinanceSuite.onPersist(S)}
function toast(msg,type='info',dur=2800){
  let el=document.getElementById('toast');
  if(!el){el=document.createElement('div');el.id='toast';document.body.appendChild(el)}
  el.className='toast toast-'+type+' show';el.textContent=msg;
  clearTimeout(window._toastT);window._toastT=setTimeout(()=>el.classList.remove('show'),dur);
}
function recompute(){
  S.accounts.forEach(a=>{let b=a.initialBalance||0;
    S.txs.filter(t=>t.accountId===a.id&&!t.isCreditCard).forEach(t=>{
      if(t.fundamentalType==='receita')b+=t.value;
      else if(t.fundamentalType==='despesa'&&t.isPaid&&t.paidByAccountId===a.id)b-=t.value;});
    a.balance=b;});
  S.cards.forEach(c=>{let u=0;S.txs.filter(t=>t.accountId===c.id&&t.isCreditCard).forEach(t=>{u+=t.fundamentalType==='despesa'?t.value:-t.value});c.availableLimit=(c.limit||0)-Math.max(0,u)});
}
const totalBalance=()=>S.accounts.reduce((s,a)=>s+(a.balance||0),0);
const cardDebt=()=>S.cards.reduce((s,c)=>s+Math.max(0,(c.limit||0)-(c.availableLimit||0)),0);
const netWorth=()=>totalBalance()-cardDebt();
const nameById=id=>{const a=S.accounts.find(x=>x.id===id)||S.cards.find(x=>x.id===id);return a?a.name:'Sem conta'};
function monthAgg(off=0){const now=new Date();const d=new Date(now.getFullYear(),now.getMonth()-off,1);const pm=d.getMonth(),py=d.getFullYear();
  const t=S.txs.filter(x=>{const dd=parseD(x.date);return dd.getMonth()===pm&&dd.getFullYear()===py});
  return{income:t.filter(x=>x.fundamentalType==='receita').reduce((s,x)=>s+x.value,0),expense:t.filter(x=>x.fundamentalType==='despesa').reduce((s,x)=>s+x.value,0)}}

function pendingTxs(){return S.txs.filter(t=>t.fundamentalType==='despesa'&&!t.isPaid&&!t.isCreditCard)}
function overdueTxs(){const today=startDay(new Date());return pendingTxs().filter(t=>parseD(t.date)<today)}
function dueSoonTxs(days=7){const today=startDay(new Date());const end=new Date(today);end.setDate(end.getDate()+days);return pendingTxs().filter(t=>{const d=parseD(t.date);return d>=today&&d<=end}).sort((a,b)=>parseD(a.date)-parseD(b.date))}
function cardDueSoon(days=10){
  const today=new Date();
  return S.cards.filter(c=>c.dueDay).map(c=>{
    let due=new Date(today.getFullYear(),today.getMonth(),c.dueDay);
    if(due<today)due=new Date(today.getFullYear(),today.getMonth()+1,c.dueDay);
    const diff=Math.round((startDay(due)-startDay(today))/864e5);
    const used=Math.max(0,(c.limit||0)-(c.availableLimit||0));
    return{card:c,due,diff,used};
  }).filter(x=>x.diff>=0&&x.diff<=days&&x.used>0).sort((a,b)=>a.diff-b.diff);
}
function savingsRate(inc,exp){return inc>0?Math.round((inc-exp)/inc*100):0}
function healthScore(cur,overdue,budgetsBad){
  let s=65;
  const bal=cur.income-cur.expense;
  if(bal>=0)s+=Math.min(20,bal>0?15:5);else s-=Math.min(25,Math.abs(bal)>500?25:15);
  if(overdue.length)s-=Math.min(30,overdue.length*8);
  if(budgetsBad)s-=Math.min(20,budgetsBad*7);
  if(totalBalance()>500)s+=10;
  if(cardDebt()>totalBalance()*0.5&&cardDebt()>0)s-=10;
  return Math.max(0,Math.min(100,s));
}
function healthLabel(s){return s>=75?'Excelente':s>=55?'Bom':s>=35?'Atenção':'Crítico'}
function buildDashAlerts(){
  const alerts=[];const overdue=overdueTxs();const soon=dueSoonTxs(7);const cards=cardDueSoon(7);
  const badBudgets=S.budgets.filter(b=>budgetStatus(spentInCategory(b.category),b.amount)==='bad');
  if(overdue.length)alerts.push({lvl:'bad',t:`${overdue.length} pagamento(s) atrasado(s)`,m:`Total de ${BRL(overdue.reduce((s,t)=>s+t.value,0))} — quite o quanto antes`,go:'tx'});
  if(soon.length&&!overdue.length)alerts.push({lvl:'warn',t:`${soon.length} conta(s) vencem em 7 dias`,m:BRL(soon.reduce((s,t)=>s+t.value,0))+' programados',go:'tx'});
  if(badBudgets.length)alerts.push({lvl:'warn',t:`Orçamento estourado: ${badBudgets.map(b=>b.category).slice(0,2).join(', ')}`,m:'Revise seus gastos ou ajuste o limite',go:'budgets'});
  if(cards.length)alerts.push({lvl:'warn',t:`Fatura${cards.length>1?'s':''} de cartão próxima(s)`,m:cards.slice(0,2).map(x=>`${x.card.name} em ${x.diff}d (${BRL(x.used)})`).join(' · '),go:'faturas'});
  const cur=monthAgg(0);const prev=monthAgg(1);const sr=savingsRate(cur.income,cur.expense);
  if(cur.income>0&&sr>=15&&!overdue.length)alerts.push({lvl:'good',t:`Poupança de ${sr}% este mês`,m:`Você guardou cerca de ${BRL(cur.income-cur.expense)}`,go:'reports'});
  else if(cur.expense>prev.expense*1.2&&prev.expense>0)alerts.push({lvl:'warn',t:'Gastos acima da média',m:`${Math.round((cur.expense/prev.expense-1)*100)}% a mais que o mês passado`,go:'reports'});
  return alerts.slice(0,3);
}
function topCategoryCompare(){
  const now=new Date();const curM=now.getMonth(),curY=now.getFullYear();
  const prevD=new Date(curY,curM-1,1);const prevM=prevD.getMonth(),prevY=prevD.getFullYear();
  const sum=(m,y)=>{const o={};S.txs.filter(t=>{const d=parseD(t.date);return t.fundamentalType==='despesa'&&d.getMonth()===m&&d.getFullYear()===y}).forEach(t=>{const c=t.category||'Outros';o[c]=(o[c]||0)+t.value});return o};
  const c=sum(curM,curY),p=sum(prevM,prevY);
  let best=null,bestPct=0;
  Object.keys(c).forEach(k=>{if(p[k]>0){const pct=(c[k]-p[k])/p[k]*100;if(pct>bestPct){bestPct=pct;best={cat:k,cur:c[k],prev:p[k],pct}}}});
  return best&&bestPct>15?best:null;
}
function trendMonths(n=6){const out=[];for(let i=n-1;i>=0;i--){const a=monthAgg(i);const d=new Date();d.setMonth(d.getMonth()-i);out.push({label:d.toLocaleDateString('pt-BR',{month:'short'}),income:a.income,expense:a.expense})}return out}
function trendBarSVG(data,w,h){
  const max=Math.max(...data.flatMap(d=>[d.income,d.expense]),1);const pad=8;const gw=w-pad*2;const bw=gw/data.length;
  let bars='';data.forEach((d,i)=>{const x=pad+i*bw;const ih=Math.max(2,(d.income/max)*(h-24));const eh=Math.max(2,(d.expense/max)*(h-24));
    bars+=`<rect x="${(x+bw*.08).toFixed(1)}" y="${(h-8-ih).toFixed(1)}" width="${(bw*.38).toFixed(1)}" height="${ih.toFixed(1)}" rx="2" fill="#059669" opacity=".85"/>`;
    bars+=`<rect x="${(x+bw*.52).toFixed(1)}" y="${(h-8-eh).toFixed(1)}" width="${(bw*.38).toFixed(1)}" height="${eh.toFixed(1)}" rx="2" fill="#dc2626" opacity=".85"/>`;
    bars+=`<text x="${(x+bw/2).toFixed(1)}" y="${h-1}" text-anchor="middle" font-size="9" fill="#94a3b8" font-weight="600">${d.label}</text>`});
  return bars;
}
function healthRingSVG(score){
  const r=26,c=2*Math.PI*r,off=c*(1-score/100);
  const col=score>=75?'#059669':score>=55?'#d97706':'#dc2626';
  return `<svg class="health-ring" width="60" height="60" viewBox="0 0 60 60"><circle cx="30" cy="30" r="${r}" fill="none" stroke="rgba(255,255,255,.15)" stroke-width="5"/><circle cx="30" cy="30" r="${r}" fill="none" stroke="${col}" stroke-width="5" stroke-dasharray="${c.toFixed(1)}" stroke-dashoffset="${off.toFixed(1)}" stroke-linecap="round" transform="rotate(-90 30 30)"/><text x="30" y="34" text-anchor="middle" font-size="13" font-weight="800" fill="#fff">${score}</text></svg>`;
}
function upcomingHtml(hv){
  const today=startDay(new Date());const items=[];
  overdueTxs().slice(0,3).forEach(t=>items.push({d:parseD(t.date),title:t.description||t.category||'Despesa',sub:'Atrasado',val:t.value,overdue:true,txId:t.id}));
  dueSoonTxs(14).slice(0,4).forEach(t=>{if(!items.find(x=>x.txId===t.id))items.push({d:parseD(t.date),title:t.description||t.category||'Despesa',sub:'A pagar',val:t.value,overdue:false,txId:t.id})});
  cardDueSoon(14).slice(0,2).forEach(x=>items.push({d:x.due,title:`Fatura ${x.card.name}`,sub:`Vence em ${x.diff} dias`,val:x.used,overdue:false,go:'accounts'}));
  items.sort((a,b)=>a.d-b.d);
  if(!items.length)return '<p style="color:var(--txt3);font-size:.875rem">Nenhum vencimento nos próximos 14 dias.</p>';
  return items.slice(0,5).map(it=>{
    const od=it.overdue;
    return `<div class="upcoming-item" onclick="${it.go?`go('${it.go}')`:it.txId?`openTxSheet('${it.txId}')`:''}">
      <div class="upcoming-date"><div class="ud">${it.d.getDate()}</div><div class="um">${it.d.toLocaleDateString('pt-BR',{month:'short'})}</div></div>
      <div class="upcoming-mid"><div class="ut">${esc(it.title)}</div><div class="us">${it.sub}</div></div>
      <div class="upcoming-val num ${od?'overdue':''}">${hv(it.val)}</div></div>`}).join('');
}

/* Live cash flow */
function project(days){
  const today=startDay(new Date());const hz=new Date(today);hz.setDate(hz.getDate()+days);
  let start=totalBalance();
  const futInc=S.txs.filter(t=>t.fundamentalType==='receita'&&parseD(t.date)>today);start-=futInc.reduce((s,t)=>s+t.value,0);
  const overdue=S.txs.filter(t=>t.fundamentalType==='despesa'&&!t.isCreditCard&&!t.isPaid&&parseD(t.date)<today);const ovSum=overdue.reduce((s,t)=>s+t.value,0);
  const ev={};const add=(dt,a)=>{let d=startDay(dt);if(d<today)d=new Date(today);if(d>hz)return;(ev[iso(d)]=ev[iso(d)]||[]).push(a)};
  futInc.forEach(t=>add(parseD(t.date),+t.value));
  S.txs.filter(t=>t.fundamentalType==='despesa'&&!t.isCreditCard&&!t.isPaid&&parseD(t.date)>=today).forEach(t=>add(parseD(t.date),-t.value));
  if(ovSum>0)add(new Date(today),-ovSum);
  S.cards.forEach(c=>{const u=Math.max(0,(c.limit||0)-(c.availableLimit||0));if(u<=0||!c.dueDay)return;let due=new Date(today.getFullYear(),today.getMonth(),c.dueDay);if(due<today)due=new Date(today.getFullYear(),today.getMonth()+1,c.dueDay);if(due<=hz)add(due,-u)});
  const pts=[];let run=start,low={d:new Date(today),b:run},breach=null;
  for(let i=0;i<=days;i++){const d=new Date(today);d.setDate(d.getDate()+i);const evs=ev[iso(d)]||[];run+=evs.reduce((s,a)=>s+a,0);run=Math.round(run*100)/100;pts.push({d:new Date(d),b:run});if(run<low.b)low={d:new Date(d),b:run};if(!breach&&run<0)breach={d:new Date(d),b:run}}
  return{today,days,start:Math.round(start*100)/100,end:pts[pts.length-1].b,pts,low,breach}}
function insight(p){const f=v=>BRL(Math.abs(v));
  if(p.breach){const dd=Math.round((p.breach.d-p.today)/864e5);const q=dd<=0?'hoje':dd===1?'amanhã':`em ${dd} dias (${p.breach.d.toLocaleDateString('pt-BR')})`;
    return{lvl:'bad',t:'Risco de saldo negativo',m:`Nesse ritmo, seu saldo fica negativo ${q}. Faltam ${f(p.breach.b)}. Considere adiar gastos ou antecipar uma entrada.`}}
  if(p.low.b<300)return{lvl:'warn',t:'Mês apertado',m:`Seu ponto mais baixo será ${f(p.low.b)} em ${p.low.d.toLocaleDateString('pt-BR')}. Segure os supérfluos.`};
  return{lvl:'good',t:'Tudo sob controle',m:`Projeção saudável: você fecha o período com cerca de ${f(p.end)}.`}}
function areaSVG(vals,w,h,pad){pad=pad||6;const min=Math.min(...vals,0),max=Math.max(...vals,0);const rng=(max-min)||1;
  const X=i=>pad+i*((w-2*pad)/((vals.length-1)||1));const Y=v=>pad+(1-(v-min)/rng)*(h-2*pad);
  let line=vals.map((v,i)=>(i?'L':'M')+X(i).toFixed(1)+' '+Y(v).toFixed(1)).join(' ');
  const area=line+` L ${X(vals.length-1).toFixed(1)} ${(h-pad).toFixed(1)} L ${X(0).toFixed(1)} ${(h-pad).toFixed(1)} Z`;
  return{line,area,zeroY:min<0?Y(0):null,X,Y}}
const chartW=(ratio=.88)=>Math.min(Math.max(Math.floor((window.innerWidth>=1024?window.innerWidth*.38:window.innerWidth*ratio)-32),280),960);

/* ─────────── Top bar ─────────── */
function spentInCategory(cat,off=0){const now=new Date();const m=new Date(now.getFullYear(),now.getMonth()-off,1);
  return S.txs.filter(t=>{const d=parseD(t.date);return t.fundamentalType==='despesa'&&t.category===cat&&d.getMonth()===m.getMonth()&&d.getFullYear()===m.getFullYear()}).reduce((s,t)=>s+t.value,0)}
function budgetStatus(spent,limit){const p=limit>0?spent/limit*100:0;if(p>100)return'bad';if(p>75)return'warn';return'ok'}
function budgetBadge(st){return st==='bad'?'<span class="badge badge-bad">Estourado</span>':st==='warn'?'<span class="badge badge-warn">Atenção</span>':'<span class="badge badge-ok">No limite</span>'}
function budgetDetail(b,off=0){
  const sp=spentInCategory(b.category,off);const st=budgetStatus(sp,b.amount);
  const pct=b.amount?Math.round(sp/b.amount*100):0;const left=b.amount-sp;

  const prevSp=spentInCategory(b.category,off+1);

function sortBudgetItems(items){
  const ord={bad:0,warn:1,ok:2};
  const s=[...items];

function goalDetail(g){
  const target=g.target||0,saved=g.saved||0;
  const pct=target?Math.min(100,Math.round(saved/target*100)):0;
  const left=Math.max(0,target-saved);
  let daysLeft=null,monthlyNeed=null,status='ok',tip='';
  if(g.deadline){
    const today=startDay(new Date());const dl=parseD(g.deadline);
    daysLeft=Math.round((dl-today)/864e5);
    if(left<=0){status='done';tip='Meta concluída! Parabéns.'}
    else if(daysLeft<0){status='bad';tip=`Prazo encerrado há ${Math.abs(daysLeft)} dia(s). Faltam ${BRL(left)}.`}
    else{
      monthlyNeed=left/Math.max(daysLeft/30.44,.1);
      if(daysLeft<=30){status='bad';tip=`Faltam ${daysLeft} dias — guarde cerca de ${BRL(monthlyNeed)}/mês para bater a meta.`}
      else if(daysLeft<=90||pct<40){status='warn';tip=`${daysLeft} dias restantes · meta mensal sugerida: ${BRL(monthlyNeed)}`}
      else tip=`No ritmo atual (${pct}%), você está a caminho. Sugestão: ${BRL(monthlyNeed)}/mês.`;
    }
  }else if(left<=0){status='done';tip='Meta concluída!'}
  else tip=left>0?`Faltam ${BRL(left)} para concluir esta meta.`:'';
  return{target,saved,pct,left,daysLeft,monthlyNeed,status,tip};
}

const esc=s=>String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');

/* ─────────── TRANSAÇÕES ─────────── */
let txFilterOffset=0;
function txsInMonth(off=txFilterOffset){
  const now=new Date();const d=new Date(now.getFullYear(),now.getMonth()-off,1);
  const m=d.getMonth(),y=d.getFullYear();
  return S.txs.filter(t=>{const dd=parseD(t.date);return dd.getMonth()===m&&dd.getFullYear()===y}).sort((a,b)=>parseD(b.date)-parseD(a.date));
}
function applyTxFilters(list){
  const f=S.txFilters;const q=f.q.toLowerCase();
  return list.filter(t=>{
    if(f.type!=='all'&&t.fundamentalType!==f.type)return false;
    if(f.cat&&t.category!==f.cat)return false;
    if(f.acc&&t.accountId!==f.acc)return false;
    if(f.status==='paid'&&!t.isPaid&&t.fundamentalType==='despesa')return false;
    if(f.status==='pending'&&(t.isPaid||t.fundamentalType==='receita'))return false;
    if(f.status==='overdue'){if(t.isPaid||t.isCreditCard||t.fundamentalType!=='despesa')return false;if(parseD(t.date)>=startDay(new Date()))return false}
    if(q){const hay=[t.description,t.category,nameById(t.accountId)].join(' ').toLowerCase();if(!hay.includes(q))return false}
    return true;
  });
}
function txBiggestExpense(list){
  const exp=list.filter(t=>t.fundamentalType==='despesa');
  if(!exp.length)return null;
  return exp.reduce((a,b)=>a.value>=b.value?a:b);
}
function txCatBreakdown(list){
  const o={};list.filter(t=>t.fundamentalType==='despesa').forEach(t=>{const c=t.category||'Outros';o[c]=(o[c]||0)+t.value});
  const entries=Object.entries(o).sort((a,b)=>b[1]-a[1]);const max=entries.length?entries[0][1]:1;
  return{entries:entries.slice(0,5),max};
}
function txGroupByDay(list){
  const groups=[];let cur=null;
  list.forEach(t=>{
    const dk=iso(parseD(t.date));
    if(!cur||cur.key!==dk){
      cur={key:dk,label:parseD(t.date).toLocaleDateString('pt-BR',{weekday:'long',day:'2-digit',month:'long'}),items:[],inc:0,exp:0};
      groups.push(cur);
    }
    cur.items.push(t);
    if(t.fundamentalType==='receita')cur.inc+=t.value;else cur.exp+=t.value;
  });
  return groups;
}
function txRow(t,opts={}){const inc=t.fundamentalType==='receita';const cat=t.category||'Outros';
  const today=startDay(new Date());const overdue=!inc&&!t.isPaid&&!t.isCreditCard&&parseD(t.date)<today;
  const pending=!inc&&!t.isPaid&&!overdue;
  let tags='';
  if(overdue)tags+=`<span class="tx-tag overdue">Atrasado</span>`;
  else if(pending)tags+=`<span class="tx-tag pending">Pendente</span>`;
  if(opts.showCat)tags+=`<span class="tx-tag cat">${esc(cat)}</span>`;
  const hasRec=t.receipt?.imageId;
  return `<div class="tx" onclick="openTxSheet('${t.id}')"><div class="tx-ic" style="background:${inc?'var(--pos-soft)':catBg(cat)};color:${inc?'var(--pos)':catColor(cat)}">${inc?'+':catInitial(cat)}</div>
    <div class="tx-mid"><div class="tx-d">${esc(t.description||cat)}${hasRec?'<span class="tx-receipt-badge" title="Comprovante salvo">📎</span>':''}${tags}</div><div class="tx-s">${opts.hideDate?'':parseD(t.date).toLocaleDateString('pt-BR',{day:'2-digit',month:'short'})+' · '}${esc(nameById(t.accountId))}</div></div>
    <div class="tx-v num" style="color:${inc?'var(--pos)':'var(--neg)'}">${inc?'+':'−'}${S.hide?'•••':BRL(t.value)}</div></div>`}
function bindTxPage(){
  const s=document.getElementById('tx-search');
  if(s&&!s._bound){s._bound=1;s.addEventListener('input',()=>{clearTimeout(window._txSq);window._txSq=setTimeout(()=>{S.txFilters.q=s.value.trim();render()},280)})}
  document.querySelectorAll('[data-txf]').forEach(el=>{el.onclick=()=>{S.txFilters[el.dataset.txf]=el.dataset.v;render()}});
  const cat=document.getElementById('tx-f-cat');if(cat)cat.onchange=()=>{S.txFilters.cat=cat.value;render()};
  const acc=document.getElementById('tx-f-acc');if(acc)acc.onchange=()=>{S.txFilters.acc=acc.value;render()};
}
function clearTxFilters(){S.txFilters={type:'all',cat:'',acc:'',status:'all',q:''};render()}
function viewTx(){
  const now=new Date();const d=new Date(now.getFullYear(),now.getMonth()-txFilterOffset,1);
  const monthAll=txsInMonth();const list=applyTxFilters(monthAll);
  const cur=monthAgg(txFilterOffset);const prev=monthAgg(txFilterOffset+1);
  const inc=list.filter(t=>t.fundamentalType==='receita').reduce((s,t)=>s+t.value,0);
  const exp=list.filter(t=>t.fundamentalType==='despesa').reduce((s,t)=>s+t.value,0);
  const monthInc=monthAll.filter(t=>t.fundamentalType==='receita').reduce((s,t)=>s+t.value,0);
  const monthExp=monthAll.filter(t=>t.fundamentalType==='despesa').reduce((s,t)=>s+t.value,0);
  const expDelta=prev.expense?Math.round((monthExp/prev.expense-1)*100):0;
  const daysInMonth=new Date(d.getFullYear(),d.getMonth()+1,0).getDate();
  const dayOfMonth=txFilterOffset===0?now.getDate():daysInMonth;
  const dailyAvg=dayOfMonth>0?monthExp/dayOfMonth:0;
  const biggest=txBiggestExpense(monthAll);
  const pendingMonth=monthAll.filter(t=>t.fundamentalType==='despesa'&&!t.isPaid&&!t.isCreditCard);
  const overdueMonth=pendingMonth.filter(t=>parseD(t.date)<startDay(new Date()));
  const f=S.txFilters;const hasFilters=f.type!=='all'||f.cat||f.acc||f.status!=='all'||f.q;
  const hv=v=>S.hide?'•••••':BRL(v);
  const {entries:catEntries,max:catMax}=txCatBreakdown(monthAll);
  const chip=(k,v,l,cls='')=>`<button type="button" class="tx-chip ${cls} ${f[k]===v?'on':''}" data-txf="${k}" data-v="${v}">${l}</button>`;
  let html=`<div class="page-header" style="display:flex;align-items:flex-start;justify-content:space-between;gap:1rem;flex-wrap:wrap">
    <div><div class="page-title">Transações</div><div class="page-sub">Controle, filtros e análise do mês</div></div>
    <button class="chip-link" style="padding:.5rem 1rem;background:var(--brand);color:#fff;border-color:var(--brand)" onclick="openTxSheet()">+ Novo lançamento</button></div>`;
  if(overdueMonth.length&&f.status!=='paid'){
    html+=`<div class="tx-pending-banner overdue" onclick="txFilterStatus('overdue')">
      <div><div class="pt">${overdueMonth.length} pagamento(s) atrasado(s) neste mês</div><div class="pm num">${hv(overdueMonth.reduce((s,t)=>s+t.value,0))} — toque para filtrar</div></div><span class="dash-alert-go">Ver →</span></div>`;
  }else if(pendingMonth.length&&txFilterOffset===0&&f.status==='all'){
    html+=`<div class="tx-pending-banner" onclick="txFilterStatus('pending')">
      <div><div class="pt">${pendingMonth.length} conta(s) a pagar neste mês</div><div class="pm num">${hv(pendingMonth.reduce((s,t)=>s+t.value,0))} pendente(s)</div></div><span class="dash-alert-go">Ver →</span></div>`;
  }
  html+=`<div class="tx-insights">
    <div class="tx-insight"><div class="k">Lançamentos</div><div class="v">${list.length}${hasFilters?` / ${monthAll.length}`:''}</div></div>
    <div class="tx-insight"><div class="k">Média/dia</div><div class="v num">${hv(dailyAvg)}</div></div>
    <div class="tx-insight"><div class="k">Maior gasto</div><div class="v">${biggest?esc((biggest.description||biggest.category||'—').slice(0,18)):'—'}${biggest&&!S.hide?`<br><span class="num" style="color:var(--neg)">${BRL(biggest.value)}</span>`:''}</div></div></div>`;
  html+=`<div class="tx-toolbar">
    <input type="search" class="tx-search" id="tx-search" placeholder="Buscar por descrição, categoria ou conta…" value="${esc(f.q)}">
    <div class="tx-chips">
      ${chip('type','all','Todos')}${chip('type','despesa','Despesas','bad')}${chip('type','receita','Receitas','pos')}
      ${chip('status','all','Status: todos')}${chip('status','pending','Pendentes','warn')}${chip('status','paid','Pagos')}${chip('status','overdue','Atrasados','bad')}
    </div>
    <div class="tx-filters">
      <select id="tx-f-cat"><option value="">Todas categorias</option>${S.cats.map(c=>`<option value="${esc(c)}" ${f.cat===c?'selected':''}>${esc(c)}</option>`).join('')}</select>
      <select id="tx-f-acc"><option value="">Todas contas</option>${S.accounts.map(a=>`<option value="${a.id}" ${f.acc===a.id?'selected':''}>${esc(a.name)}</option>`).join('')}${S.cards.map(c=>`<option value="${c.id}" ${f.acc===c.id?'selected':''}>${esc(c.name)} (cartão)</option>`).join('')}</select>
    </div>
    ${hasFilters?`<span class="tx-filter-clear" onclick="clearTxFilters()">Limpar filtros</span>`:''}
  </div>`;
  html+=`<div class="tx-layout"><div class="tx-side">`;
  html+=`<div class="tx-summary-hero"><div class="month-nav">
      <button class="chip-link" onclick="txMonthPrev()">‹ Anterior</button>
      <div class="sec-t" style="text-transform:capitalize;text-align:center;flex:1">${d.toLocaleDateString('pt-BR',{month:'long',year:'numeric'})}</div>
      <button class="chip-link" onclick="txMonthNext()" style="opacity:${txFilterOffset>0?1:.35}">Próximo ›</button></div>
    <div class="tx-summary-kpis">
      <div class="tx-sk"><div class="k">Entradas</div><div class="v num pos">${hv(monthInc)}</div></div>
      <div class="tx-sk"><div class="k">Saídas</div><div class="v num neg">${hv(monthExp)}</div></div>
      <div class="tx-sk"><div class="k">Saldo</div><div class="v num ${monthInc-monthExp>=0?'pos':'neg'}">${hv(monthInc-monthExp)}</div></div></div>
    ${prev.expense>0?`<div class="tx-compare">Saídas ${expDelta>=0?'<b>+'+expDelta+'%</b>':'<b>'+expDelta+'%</b>'} vs. mês anterior (${hv(prev.expense)})</div>`:''}</div>`;
  if(catEntries.length){
    html+=`<div class="sec tx-cats-sec" style="margin-top:1.25rem"><div class="sec-h"><div class="sec-t">Top categorias</div><div class="sec-sub">${catEntries.length} com gasto</div></div>`;
    html+=catEntries.map(([c,v])=>`<div class="tx-cat-row"><span class="cn">${esc(c)}</span><div class="bar"><i data-w="${Math.max(8,v/catMax*100)}"></i></div><span class="cv num">${hv(v)}</span></div>`).join('');
    html+=`</div>`;
  }
  html+=`</div><div class="tx-list-col">`;
  if(!list.length){
    html+=emptyState('report',hasFilters?'Nenhum resultado':'Nenhuma transação',hasFilters?'Tente outros filtros ou limpe a busca.':'Use o botão acima para registrar entradas e saídas.');
  }else{
    html+=`<div class="sec">`;
    txGroupByDay(list).forEach(g=>{
      const net=g.inc-g.exp;
      html+=`<div class="date-h"><span>${g.label}</span><span class="date-total num ${net>=0?'pos':'neg'}">${net>=0?'+':''}${hv(net)} · ${g.items.length} item(ns)</span></div>`;
      g.items.forEach(t=>{html+=txRow(t,{showCat:true,hideDate:true})});
    });
    html+=`</div>`;
  }
  html+=`</div></div>`;
  return html;
}

function viewFaturas(){
  const hv=v=>S.hide?'•••••':BRL(v);
  const debt=cardDebt();

        <div class="fat-amt num">${hv(used)}</div></div>
      <div class="progress" style="margin-bottom:.75rem"><i data-w="${pct}" style="background:${pct>85?'var(--neg)':'var(--brand)'}"></i></div>

        <button class="chip-link" onclick="openTxSheet()">+ Lançamento</button></div></div>`;
  });
  return html;
}
let editPayBillCardId=null;
function openPayBillSheet(cardId){
  const c=S.cards.find(x=>x.id===cardId);if(!c)return;
  editPayBillCardId=cardId;const used=cardUsed(c);
  if(!S.accounts.length){toast('Cadastre uma conta bancária primeiro','warn');go('accounts');return}
  const accOpts=S.accounts.map(a=>`<option value="${a.id}">${esc(a.name)} — ${BRL(a.balance||0)}</option>`).join('');
  openSheet(`<div class="sheet-head"><h3>Pagar fatura</h3></div>
    <div class="insight ins-warn" style="margin-bottom:1rem"><div class="dot"></div><div><div class="it">${esc(c.name)}</div><div class="im num">Fatura: ${BRL(used)}</div></div></div>
    <div class="fld"><label>Valor do pagamento (R$)</label><input id="pb-amt" type="number" inputmode="decimal" step="0.01" value="${used||''}"></div>
    <div class="fld"><label>Pagar com a conta</label><select id="pb-acc"><option value="">Selecione…</option>${accOpts}</select></div>
    <div class="fld"><label>Data</label><input id="pb-date" type="date" value="${iso(new Date())}"></div>`,
    `<button class="save" onclick="savePayBill()">Confirmar pagamento</button>`);
}
function savePayBill(){
  const cardId=editPayBillCardId;const c=S.cards.find(x=>x.id===cardId);
  const amount=parseFloat(document.getElementById('pb-amt').value);
  const sourceId=document.getElementById('pb-acc').value;const date=document.getElementById('pb-date').value;
  if(!c||!amount||amount<=0||!sourceId||!date){toast('Preencha todos os campos','err');return}
  S.txs.push({id:uid(),description:`Pagamento Fatura ${c.name}`,value:amount,date,fundamentalType:'despesa',category:'Pagamento de Fatura',
    isPaid:true,accountId:sourceId,isCreditCard:false,paidByAccountId:sourceId,paidByIsCreditCard:false,installments:null,groupId:null,isRecurring:false});
  S.txs.push({id:uid(),description:`Pagamento recebido — ${c.name}`,value:amount,date,fundamentalType:'receita',category:'Pagamento de Fatura',
    isPaid:true,accountId:cardId,isCreditCard:true,paidByAccountId:null,paidByIsCreditCard:false,installments:null,groupId:null,isRecurring:false});
  persist();closeSheet();toast(`Pagamento de ${BRL(amount)} registrado`,'ok');render();
}

  const items=[];
  const byDesc={};
  S.txs.filter(t=>t.fundamentalType==='despesa').forEach(t=>{
    const key=(t.description||'').toLowerCase().trim().slice(0,40);
    if(!key||key.length<4)return;
    if(!byDesc[key])byDesc[key]={total:0,count:0};
    byDesc[key].total+=t.value;byDesc[key].count++;
  });
  Object.entries(byDesc).filter(([,v])=>v.count>=3).sort((a,b)=>b[1].total-a[1].total).slice(0,4).forEach(([k,v])=>{
    items.push({lvl:'info',icon:'↻',title:k,m:`${v.count} lançamentos · ${BRL(v.total)} — possível gasto recorrente`,go:'tx'});
  });
  const cmp=topCategoryCompare();
  if(cmp)items.push({lvl:'warn',icon:'↑',title:`${cmp.cat} subiu ${Math.round(cmp.pct)}%`,m:`${BRL(cmp.cur)} este mês vs ${BRL(cmp.prev)} no anterior`,go:'reports'});
  const cur=monthAgg(0);const sr=savingsRate(cur.income,cur.expense);
  if(cur.income>0)items.push({lvl:sr>=10?'good':'warn',icon:sr>=10?'✓':'!',title:`Poupança de ${sr}%`,m:`Saldo do mês: ${BRL(cur.income-cur.expense)}`,go:'reports'});
  overdueTxs().slice(0,1).forEach(()=>items.push({lvl:'bad',icon:'!',title:`${overdueTxs().length} pagamento(s) atrasado(s)`,m:BRL(overdueTxs().reduce((s,t)=>s+t.value,0))+' em atraso',go:'tx'}));
  S.goals.forEach(g=>{const d=goalDetail(g);if(d.status==='warn'||d.status==='bad')items.push({lvl:d.status,icon:'◎',title:g.name,m:d.tip,go:'goals'})});
  S.budgets.filter(b=>budgetStatus(spentInCategory(b.category),b.amount)==='bad').slice(0,2).forEach(b=>{
    items.push({lvl:'bad',icon:'○',title:`Orçamento: ${b.category}`,m:`Estourou ${BRL(spentInCategory(b.category)-b.amount)}`,go:'budgets'});
  });
  if(!items.length)items.push({lvl:'good',icon:'★',title:'Finanças equilibradas',m:'Nenhum alerta crítico no momento. Continue registrando seus lançamentos.',go:'home'});
  return items.slice(0,8);
}

let editBudgetId=null;
function openBudgetSheet(id,presetCat,presetAmt){
  const b=id?S.budgets.find(x=>x.id===id):null;editBudgetId=id||null;
  const cat=presetCat||(b?b.category:'Outros');
  const spent=b?spentInCategory(b.category,S.budgetMonthOffset):spentInCategory(cat,S.budgetMonthOffset);
  const suggest=!b?suggestBudgetAmount(cat):null;
  const avg=avgSpendCategory(cat,3);
  openSheet(`<div class="sheet-head"><h3>${b?'Editar orçamento':'Novo orçamento'}</h3>${b?`<button class="del-btn" onclick="deleteBudget('${b.id}')">Excluir</button>`:''}</div>
    ${spent>0?`<div class="insight ins-warn" style="margin-bottom:1rem"><div class="dot"></div><div><div class="it">Gasto atual em ${esc(cat)}</div><div class="im num">${BRL(spent)} neste mês</div></div></div>`:''}
    <div class="fld"><label>Categoria</label><select id="bd-cat" ${b?'disabled':''}>${catOptions(cat)}</select></div>
    <div class="fld"><label>Limite mensal (R$)</label><input id="bd-amt" type="number" inputmode="decimal" placeholder="0,00" value="${b?b.amount:(presetAmt||'')}"></div>
    ${!b&&suggest?`<p style="font-size:.8125rem;color:var(--txt2);margin:-.5rem 0 1rem">Sugestão: <b class="num">${BRL(suggest)}</b> (média ${avg?BRL(avg):'—'} + 5%) · <span class="sec-link" onclick="document.getElementById('bd-amt').value=${suggest}">Usar sugestão</span></p>`:''}
    <button class="save" onclick="saveBudget()">Salvar</button>`);
  if(!b){const sel=document.getElementById('bd-cat');if(sel)sel.onchange=()=>{const c=sel.value;const s=suggestBudgetAmount(c);const hint=document.getElementById('bd-amt');if(hint&&!hint.value)hint.placeholder=BRL(s).replace('R$','').trim()}}
}
function saveBudget(){
  const cat=document.getElementById('bd-cat').value;const amt=parseFloat(document.getElementById('bd-amt').value);
  if(!cat||!amt||amt<=0){document.getElementById('bd-amt').focus();return}
  if(!editBudgetId&&S.budgets.some(b=>b.category===cat)){toast('Já existe orçamento para esta categoria','warn');return}
  if(editBudgetId){Object.assign(S.budgets.find(x=>x.id===editBudgetId),{category:cat,amount:amt})}
  else S.budgets.push({id:uid(),category:cat,amount:amt});
  persist();closeSheet();toast('Orçamento salvo','ok');render();
}
function deleteBudget(id){if(!confirm('Excluir este orçamento?'))return;S.budgets=S.budgets.filter(b=>b.id!==id);persist();closeSheet();render()}

function openGoalSheet(id){
  const g=id?S.goals.find(x=>x.id===id):null;editGoalId=id||null;
  openSheet(`<div class="sheet-head"><h3>${g?'Editar meta':'Nova meta'}</h3>${g?`<button class="del-btn" onclick="deleteGoal('${g.id}')">Excluir</button>`:''}</div>
    <div class="fld"><label>Nome</label><input id="gl-name" type="text" placeholder="Ex: Reserva de emergência" value="${g?esc(g.name):''}"></div>
    <div class="fld row2"><div><label>Valor alvo (R$)</label><input id="gl-target" type="number" inputmode="decimal" value="${g?g.target:''}"></div>
      <div><label>Já guardado (R$)</label><input id="gl-saved" type="number" inputmode="decimal" value="${g?g.saved:0}"></div></div>
    <div class="fld"><label>Prazo</label><input id="gl-deadline" type="date" value="${g&&g.deadline?g.deadline:''}"></div>
    <button class="save" onclick="saveGoal()">Salvar</button>`);
}
function saveGoal(){
  const name=document.getElementById('gl-name').value.trim();const target=parseFloat(document.getElementById('gl-target').value);
  const saved=parseFloat(document.getElementById('gl-saved').value)||0;const deadline=document.getElementById('gl-deadline').value||null;
  if(!name||!target||target<=0){document.getElementById('gl-name').focus();return}
  const base={name,target,saved,deadline,description:''};
  if(editGoalId){Object.assign(S.goals.find(x=>x.id===editGoalId),base)}else S.goals.push({id:uid(),...base});
  persist();closeSheet();toast('Meta salva','ok');render();
}
function deleteGoal(id){if(!confirm('Excluir esta meta?'))return;S.goals=S.goals.filter(g=>g.id!==id);persist();closeSheet();render()}

function addCategory(){
  const name=document.getElementById('new-cat')?.value?.trim();
  if(!name){toast('Digite o nome da categoria','err');return}
  if(S.cats.includes(name)){toast('Categoria já existe','warn');return}
  S.cats.push(name);persist();toast('Categoria adicionada','ok');closeSheet();render();
}
function removeCategory(name){
  if(S.txs.some(t=>t.category===name)){toast('Categoria em uso','err');return}
  S.cats=S.cats.filter(c=>c!==name);persist();toast('Categoria removida','ok');openCategoriesSheet();
}
function triggerImport(){document.getElementById('import-input')?.click()}
function importData(file){
  const reader=new FileReader();
  reader.onload=()=>{
    try{
      const data=JSON.parse(reader.result);
      if(!confirm('Importar backup? Os dados atuais serão substituídos.'))return;
      if(data.accounts)S.accounts=data.accounts;
      if(data.creditCards)S.cards=data.creditCards;
      if(data.transactions)S.txs=data.transactions;
      if(data.categories)S.cats=data.categories;
      if(data.budgets)S.budgets=data.budgets;
      if(data.goals)S.goals=data.goals;
      persist();recompute();toast('Backup importado com sucesso','ok');render();
    }catch(e){toast('Arquivo inválido','err')}
  };
  reader.readAsText(file);
}
function exportCsv(){
  const escCsv=s=>'"'+String(s??'').replace(/"/g,'""')+'"';
  const rows=[['Data','Descrição','Categoria','Tipo','Valor','Conta','Pago','Cartão'].map(escCsv).join(',')];
  [...S.txs].sort((a,b)=>parseD(b.date)-parseD(a.date)).forEach(t=>{
    rows.push([t.date,t.description||'',t.category||'',t.fundamentalType||'',t.value,nameById(t.accountId),t.isPaid?'Sim':'Não',t.isCreditCard?'Sim':'Não'].map(escCsv).join(','));
  });
  const blob=new Blob(['\ufeff'+rows.join('\n')],{type:'text/csv;charset=utf-8'});
  const u=URL.createObjectURL(blob);const a=document.createElement('a');a.href=u;a.download='financas-lancamentos-'+iso(new Date())+'.csv';a.click();URL.revokeObjectURL(u);
  toast('CSV exportado','ok');
}
function exportData(){const data={accounts:S.accounts,creditCards:S.cards,transactions:S.txs,categories:S.cats,budgets:S.budgets,goals:S.goals,exportedAt:new Date().toISOString()};
  const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});const u=URL.createObjectURL(blob);
  const a=document.createElement('a');a.href=u;a.download='financas-backup-'+iso(new Date())+'.json';a.click();URL.revokeObjectURL(u);toast('Backup exportado','ok')}
function doLogout(){
  if(!confirm('Deseja sair da sua conta?'))return;
  const token=localStorage.getItem('auth_token');
  const clear=()=>{
    ['auth_token','auth_user','app_accounts_v3','app_creditCards_v3','app_transactions_v3','app_categories_v3','app_budgets_v3','financial_goals_v2'].forEach(k=>localStorage.removeItem(k));

const TransactionFormFill={
  _set(id,v){const el=document.getElementById(id);if(el&&v!=null&&v!=='')el.value=v},
  _setSel(id,v){const el=document.getElementById(id);if(el&&v&&[...el.options].some(o=>o.value===v))el.value=v},
  _isGarbageDesc(s){
    const t=String(s||'').trim().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
    if(t.length<4)return true;
    if(/^(nos|nas|nfe|nfce|cpf|cnpj|pix|valor|total|data|nome|via|doc|sat|danfe|comprovante|obrigado|volte|sempre|itens|qtd|unid|cod|descricao)$/.test(t))return true;
    if(t.split(/\s+/).length>8)return true;
    return false;
  },
  _pickDescription(data){
    const doc=data.docType||'outro';
    let desc='';
    if(doc==='pix'||doc==='boleto'||doc==='comprovante_bancario'){
      desc=data.beneficiary||data.payer||'';
    }else{
      desc=data.merchant||data.description||'';
    }
    if(this._isGarbageDesc(desc)){
      if(data.beneficiary&&!this._isGarbageDesc(data.beneficiary))desc=data.beneficiary;
      else if(data.merchant&&!this._isGarbageDesc(data.merchant))desc=data.merchant;
      else if(doc==='pix')desc='Pix';
      else if(doc==='cupom_fiscal')desc='Compra';
      else desc='';
    }
    return String(desc).slice(0,80);
  },
  apply(data={},opts={}){
    if(!data||typeof data!=='object')return;
    const doc=data.docType||'outro';
    if(data.value!=null&&data.value!==''&&!isNaN(Number(data.value)))this._set('in-val',Number(data.value));
    if(data.date)this._set('in-date',data.date);
    if(data.category)this._setSel('in-cat',data.category);
    if(data.fundamentalType){addType=data.fundamentalType;syncTypeTog()}
    const desc=this._pickDescription(data);
    if(desc)this._set('in-desc',desc);
    this._setSel('receipt-doc-type',doc);
    this._set('receipt-beneficiary',data.beneficiary||(doc==='pix'?data.merchant:''));
    this._set('receipt-cnpj',data.cnpj);this._set('receipt-cpf',data.cpf);
    this._set('receipt-nf-number',data.nfNumber);this._set('receipt-series',data.series);
    this._set('receipt-access-key',data.accessKey);this._set('receipt-time',data.time);
    this._set('receipt-pix-id',data.transactionId);this._set('receipt-due-date',data.dueDate||'');
    this._set('receipt-barcode',data.barcode);this._set('receipt-bank-auth',data.bankAuth);
    if(data.subtotal!=null&&!isNaN(Number(data.subtotal)))this._set('receipt-subtotal',Number(data.subtotal));
    if(data.discount!=null&&!isNaN(Number(data.discount)))this._set('receipt-discount',Number(data.discount));
    this._setSel('receipt-payment-method',data.paymentMethod||(doc==='pix'?'Pix':''));
    this._set('receipt-address',data.address);this._set('receipt-items',data.items);
    if(data.notes)this._set('receipt-notes',String(data.notes).slice(0,500));
    if(opts.fromScan||data.fromScan){
      this._set('receipt-scanned-at',new Date().toISOString());
      document.getElementById('receipt-panel')?.classList.add('open');
      if(window.ReceiptScanner)ReceiptScanner._showScanSummary(data);
    }
  }
};

function collectReceiptFromSheet(){
  const q=id=>document.getElementById(id)?.value?.trim()||'';
  const receipt={docType:q('receipt-doc-type'),beneficiary:q('receipt-beneficiary'),transactionId:q('receipt-pix-id'),
    dueDate:q('receipt-due-date'),barcode:q('receipt-barcode'),bankAuth:q('receipt-bank-auth'),
    cnpj:q('receipt-cnpj'),cpf:q('receipt-cpf'),nfNumber:q('receipt-nf-number'),series:q('receipt-series'),
    accessKey:q('receipt-access-key'),time:q('receipt-time'),paymentMethod:q('receipt-payment-method'),
    subtotal:parseFloat(q('receipt-subtotal'))||null,discount:parseFloat(q('receipt-discount'))||null,
    address:q('receipt-address'),items:q('receipt-items'),notes:q('receipt-notes'),scannedAt:q('receipt-scanned-at')||null,
    imageId:q('receipt-image-id')||null,imageSavedAt:q('receipt-image-saved-at')||null};
  if(!receipt.imageId){delete receipt.imageId;delete receipt.imageSavedAt}
  return Object.entries(receipt).some(([k,v])=>!['scannedAt','imageId','imageSavedAt'].includes(k)&&v!=null&&v!=='')||receipt.imageId?receipt:null;
}
function clearPendingReceiptImage(){
  if(pendingReceiptImage?.previewUrl)URL.revokeObjectURL(pendingReceiptImage.previewUrl);
  pendingReceiptImage=null;
  const block=document.getElementById('receipt-image-block');
  if(block)block.remove();
}
async function setPendingReceiptImage(file){
  if(!file)return;
  if(pendingReceiptImage?.previewUrl)URL.revokeObjectURL(pendingReceiptImage.previewUrl);
  pendingReceiptImage={file,previewUrl:URL.createObjectURL(file),tempId:null};
  document.getElementById('receipt-panel')?.classList.add('open');
  const body=document.querySelector('#receipt-body .receipt-grid');
  if(body){
    const old=document.getElementById('receipt-image-block');
    if(old)old.remove();
    body.insertAdjacentHTML('afterbegin',receiptImageBlockHtml({},editTxId));
    const img=document.getElementById('receipt-thumb');
    if(img)img.src=pendingReceiptImage.previewUrl;
  }
}
async function loadSavedReceiptThumb(imageId){
  if(!imageId||!window.ReceiptStore)return;
  try{
    const url=await ReceiptStore.getObjectUrl(imageId);
    const img=document.getElementById('receipt-thumb');
    if(img&&url)img.src=url;
  }catch(e){console.warn('[receipt thumb]',e)}

async function viewReceiptPhoto(imageId,txId){
  let url=null;
  if(pendingReceiptImage?.previewUrl&&!imageId)url=pendingReceiptImage.previewUrl;
  else if(imageId&&window.ReceiptStore)url=await ReceiptStore.getObjectUrl(imageId);
  if(!url){toast('Comprovante não encontrado','warn');return}
  let modal=document.getElementById('receipt-modal');
  if(!modal){
    modal=document.createElement('div');
    modal.id='receipt-modal';
    modal.className='receipt-modal';
    modal.innerHTML=`<button type="button" class="receipt-modal-close" onclick="closeReceiptModal()">×</button><img id="receipt-modal-img" alt="Comprovante"><div class="receipt-modal-bar"><button type="button" class="chip-link" onclick="closeReceiptModal()">Fechar</button></div>`;
    document.body.appendChild(modal);
    modal.addEventListener('click',e=>{if(e.target===modal)closeReceiptModal()});
  }

  modal.classList.add('open');

function closeReceiptModal(){
  const modal=document.getElementById('receipt-modal');
  if(!modal)return;
  modal.classList.remove('open');
  const img=document.getElementById('receipt-modal-img');

async function removeReceiptPhoto(txId){
  const t=txId?S.txs.find(x=>x.id===txId):null;
  const imageId=t?.receipt?.imageId||document.getElementById('receipt-image-id')?.value;
  if(!imageId&&!pendingReceiptImage)return;
  if(!confirm('Remover foto do comprovante? Os dados do lançamento serão mantidos.'))return;
  if(imageId&&window.ReceiptStore)await ReceiptStore.delete(imageId);
  if(t?.receipt){delete t.receipt.imageId;delete t.receipt.imageSavedAt;delete t.receipt.imageExpired}
  clearPendingReceiptImage();
  if(txId){persist();toast('Foto removida','ok');openTxSheet(txId)}
  else{const block=document.getElementById('receipt-image-block');if(block)block.remove()}
}
function bindTxSheetQuickInput(){
  const voiceBtn=document.getElementById('qi-voice-btn');
  const photoBtn=document.getElementById('qi-photo-btn');
  const photoInput=document.getElementById('qi-photo-input');
  document.getElementById('receipt-toggle')?.addEventListener('click',()=>{
    document.getElementById('receipt-panel')?.classList.toggle('open');
  });
  if(voiceBtn){
    if(!VoiceInput.isSupported()){voiceBtn.disabled=true;voiceBtn.title=VoiceInput.unsupportedMessage()}
    else voiceBtn.onclick=()=>{
      if(VoiceInput.isListening){VoiceInput.stop();return}
      voiceBtn.classList.add('recording');setQiStatus('Ouvindo… fale o valor e a descrição','busy');
      VoiceInput.start((transcript,parsed)=>{
        TransactionFormFill.apply(parsed);
        setQiStatus('Reconhecido: "'+transcript+'"','ok');
        voiceBtn.classList.remove('recording');
      },err=>{setQiStatus(err,'err');voiceBtn.classList.remove('recording')},
      ()=>voiceBtn.classList.remove('recording'));
    };
  }
  if(photoBtn&&photoInput){
    photoBtn.onclick=()=>photoInput.click();
    photoInput.onchange=async e=>{
      const file=e.target.files[0];if(!file)return;
      photoBtn.disabled=true;setQiStatus('Preparando leitor OCR…','busy');
      try{
        if(typeof ReceiptScanner==='undefined')throw new Error('Leitor OCR não carregou. Recarregue a página.');
        await setPendingReceiptImage(file);
        const result=await ReceiptScanner.scanFile(file,(pct,msg)=>{
          const st=document.getElementById('qi-status');
          if(st){st.innerHTML=`<span class="busy">${msg} (${pct}%)</span><div class="ocr-bar"><i style="width:${pct}%"></i></div>`;st.className='qi-hint busy'}
        });
        ReceiptScanner.fillTransactionForm=ReceiptScanner.fillTransactionForm||function(p){applyScanResult(p)};
        applyScanResult({...result,fundamentalType:'despesa',category:result.category||'Outros'});
        const typeLabel=(ReceiptScanner.DOC_TYPES&&ReceiptScanner.DOC_TYPES[result.docType])||'Comprovante';
        const ok=result.value||result.description||result.cnpj||result.accessKey||result.transactionId||result.barcode||result.beneficiary;
        setQiStatus(ok?`${typeLabel} lido${result.value?' — '+BRL(result.value):''}. Foto guardada — confira os dados.`:'Leitura parcial. Foto anexada — complete manualmente.',ok?'ok':'err');
      }catch(err){
        console.error('[OCR]',err);
        setQiStatus(err.message||'Erro ao ler imagem. Tente JPG/PNG ou print da tela.','err');
      }
      finally{photoBtn.disabled=false;photoInput.value=''}
    };
    if(txSheetFlags.photo)setTimeout(()=>photoInput.click(),350);
    if(txSheetFlags.photo)txSheetFlags.photo=false;
  }
  if(txSheetFlags.voice){txSheetFlags.voice=false;setTimeout(()=>voiceBtn?.click(),400)}
}

function openTxSheetWithVoice(){openTxSheet(null,{voice:true})}
async function saveTx(){
  const val=parseFloat(document.getElementById('in-val').value);if(!val||val<=0){document.getElementById('in-val').focus();return}
  const accId=document.getElementById('in-acc').value;const isCard=S.cards.some(c=>c.id===accId);
  const paid=document.getElementById('in-paid').checked;
  const receipt=collectReceiptFromSheet();
  const base={description:document.getElementById('in-desc').value||(addType==='receita'?'Receita':'Despesa'),
    value:val,date:document.getElementById('in-date').value||iso(new Date()),fundamentalType:addType,
    category:document.getElementById('in-cat').value||'Outros',accountId:accId||null,isCreditCard:isCard,
    isPaid:addType==='receita'?true:paid,
    paidByAccountId:(addType==='despesa'&&paid&&!isCard)?accId:null,paidByIsCreditCard:isCard};
  if(receipt){base.receipt=receipt;base.fromScan=!!receipt.scannedAt}
  if(pendingReceiptImage?.file&&window.ReceiptStore){
    try{
      const oldId=base.receipt?.imageId||null;
      const saved=await ReceiptStore.replace(oldId,pendingReceiptImage.file,{description:base.description});
      base.receipt=base.receipt||{};
      base.receipt.imageId=saved.id;
      base.receipt.imageSavedAt=saved.savedAt;
      delete base.receipt.imageExpired;
      if(pendingReceiptImage.previewUrl)URL.revokeObjectURL(pendingReceiptImage.previewUrl);
      pendingReceiptImage=null;
    }catch(err){
      console.error('[receipt save]',err);
      toast('Lançamento salvo, mas a foto não pôde ser guardada.','warn',4000);
    }
  }
  const nPar=parseInt(document.getElementById('in-parcelas')?.value)||1;
  if(editTxId){const t=S.txs.find(x=>x.id===editTxId);Object.assign(t,{...base,installments:nPar>1?nPar:null})}
  else if(nPar>1&&isCard&&addType==='despesa'){
    const gid=uid();const parcelVal=Math.round(val/nPar*100)/100;
    const startD=parseD(document.getElementById('in-date').value||iso(new Date()));
    for(let i=0;i<nPar;i++){
      const d=new Date(startD);d.setMonth(d.getMonth()+i);
      S.txs.push({id:uid(),...base,value:parcelVal,date:iso(d),description:(base.description||'Despesa')+` (${i+1}/${nPar})`,installments:nPar,groupId:gid,isRecurring:false});
    }
  }else S.txs.push({id:uid(),installments:nPar>1?nPar:null,groupId:null,isRecurring:false,...base});
  persist();closeSheet();render();
}

  const c=S.cards.map(x=>`<option value="${x.id}" ${x.id===sel?'selected':''}>${esc(x.name)} (cartão)</option>`).join('');

function saveCard(){const name=document.getElementById('cd-name').value.trim();if(!name){document.getElementById('cd-name').focus();return}
  const limit=parseFloat(document.getElementById('cd-limit').value)||0;const dueDay=parseInt(document.getElementById('cd-due').value)||null;
  if(editCardId){const c=S.cards.find(x=>x.id===editCardId);Object.assign(c,{name,limit,dueDay})}
  else S.cards.push({id:uid(),name,limit,dueDay,availableLimit:limit});
  persist();closeSheet();render()}
function deleteCard(id){if(!confirm('Excluir este cartão?'))return;S.txs.forEach(t=>{if(t.accountId===id&&t.isCreditCard){t.accountId=null}});S.cards=S.cards.filter(c=>c.id!==id);persist();closeSheet();render()}

/* ─────────── Init ─────────── */
const AUTH_KEYS=['auth_token','auth_user','app_accounts_v3','app_creditCards_v3','app_transactions_v3','app_categories_v3','app_budgets_v3','financial_goals_v2'];
function isProdHost(){return window.location.hostname.includes('financasmais.com')}
async function checkAuth(){
  if(!isProdHost())return true;
  const token=localStorage.getItem('auth_token');
  if(!token){location.replace('classico.html');return false}
  try{
    const r=await fetch('/api/auth.php',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+token},body:JSON.stringify({action:'me'})});
    const ct=r.headers.get('content-type')||'';
    if(!ct.includes('application/json'))throw new Error('api');
    const d=await r.json();
    if(!d.ok){AUTH_KEYS.forEach(k=>localStorage.removeItem(k));location.replace('classico.html');return false}
    if(d.user)localStorage.setItem('auth_user',JSON.stringify(d.user));
    return true;
  }catch(e){
    return true;
  }
}
async function init(){
  if(!(await checkAuth()))return;
  S.accounts=load(K.acc);S.cards=load(K.card);S.txs=load(K.tx);S.budgets=load(K.budg);S.goals=load(K.goals);
  const c=load(K.cat);S.cats=(c&&c.length)?c:DEF_CATS.slice();
  if(window.FinanceSuite)await FinanceSuite.bootstrap(S);
  if(window.ReceiptStore){
    const changed=await ReceiptStore.maintenance(S,toast);
    if(changed)persist();
  }
  render();
  window.addEventListener('resize',()=>{clearTimeout(window._rz);window._rz=setTimeout(render,200)});
}

<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#4f46e5">
<title>Finanças+ · Nova Experiência</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0b0b14; --bg2:#12121f; --card:rgba(255,255,255,.045); --card-brd:rgba(255,255,255,.08);
  --txt:#f4f5ff; --txt2:#a9adc9; --txt3:#6b6f8f;
  --brand:#7c7bff; --brand2:#a78bfa; --grad:linear-gradient(135deg,#6366f1,#a855f7 55%,#ec4899);
  --pos:#34d399; --neg:#fb7185; --warn:#fbbf24;
  --r:22px; --r2:16px; --shadow:0 20px 60px rgba(0,0,0,.45);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg);color:var(--txt);font-family:'Inter',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
body{max-width:520px;margin:0 auto;padding:0 16px calc(120px + env(safe-area-inset-bottom)) 16px;position:relative;overflow-x:hidden}
body::before{content:'';position:fixed;top:-30%;left:-20%;width:80%;height:60%;background:radial-gradient(circle,rgba(124,123,255,.22),transparent 70%);filter:blur(40px);z-index:-1;pointer-events:none}
body::after{content:'';position:fixed;bottom:-20%;right:-25%;width:80%;height:55%;background:radial-gradient(circle,rgba(236,72,153,.14),transparent 70%);filter:blur(40px);z-index:-1;pointer-events:none}
.num{font-variant-numeric:tabular-nums;letter-spacing:-.02em}

/* Topbar */
.top{display:flex;align-items:center;justify-content:space-between;padding:calc(18px + env(safe-area-inset-top)) 2px 14px}
.hi{font-size:13px;color:var(--txt2);font-weight:500}
.hi b{display:block;font-size:19px;color:var(--txt);font-weight:800;margin-top:1px;letter-spacing:-.02em}
.top-actions{display:flex;gap:8px;align-items:center}
.chip-link{font-size:11px;font-weight:700;color:var(--txt2);border:1px solid var(--card-brd);background:var(--card);padding:7px 11px;border-radius:999px;text-decoration:none;transition:.2s}
.chip-link:active{transform:scale(.95)}
.ava{width:40px;height:40px;border-radius:50%;background:var(--grad);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;color:#fff;box-shadow:0 6px 20px rgba(124,123,255,.5)}

/* Hero */
.hero{background:var(--grad);border-radius:var(--r);padding:22px 22px 18px;position:relative;overflow:hidden;box-shadow:var(--shadow);margin-bottom:14px}
.hero::before{content:'';position:absolute;top:-40px;right:-30px;width:160px;height:160px;border-radius:50%;background:rgba(255,255,255,.12)}
.hero::after{content:'';position:absolute;bottom:-60px;left:-20px;width:150px;height:150px;border-radius:50%;background:rgba(255,255,255,.07)}
.hero-lbl{font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:rgba(255,255,255,.75);position:relative;display:flex;align-items:center;gap:8px}
.eye{cursor:pointer;opacity:.8}
.hero-val{font-size:38px;font-weight:900;color:#fff;margin-top:6px;position:relative;letter-spacing:-.03em}
.hero-delta{display:inline-flex;align-items:center;gap:5px;margin-top:10px;font-size:12px;font-weight:700;background:rgba(255,255,255,.18);color:#fff;padding:5px 10px;border-radius:999px;position:relative;backdrop-filter:blur(4px)}
.hero-spark{margin-top:14px;position:relative;height:44px}

/* Stat trio */
.trio{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px}
.stat{background:var(--card);border:1px solid var(--card-brd);border-radius:var(--r2);padding:13px 12px;backdrop-filter:blur(12px)}
.stat .ic{width:30px;height:30px;border-radius:9px;display:flex;align-items:center;justify-content:center;margin-bottom:9px}
.stat .k{font-size:10px;color:var(--txt3);font-weight:700;text-transform:uppercase;letter-spacing:.05em}
.stat .v{font-size:15px;font-weight:800;margin-top:2px}

/* Section */
.sec{background:var(--card);border:1px solid var(--card-brd);border-radius:var(--r);padding:18px;margin-bottom:16px;backdrop-filter:blur(12px)}
.sec-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.sec-t{font-size:15px;font-weight:800;letter-spacing:-.01em}
.sec-sub{font-size:11px;color:var(--txt3);font-weight:600}
.seg{display:flex;gap:3px;background:rgba(255,255,255,.05);padding:3px;border-radius:11px}
.seg button{border:0;background:transparent;color:var(--txt3);font-size:11px;font-weight:700;padding:5px 9px;border-radius:8px;cursor:pointer;transition:.2s}
.seg button.on{background:rgba(255,255,255,.12);color:var(--txt)}

/* Insight */
.insight{display:flex;gap:11px;align-items:flex-start;padding:12px 13px;border-radius:14px;margin-bottom:14px;border:1px solid transparent}
.insight .dot{width:9px;height:9px;border-radius:50%;margin-top:5px;flex:0 0 auto}
.insight .it{font-size:13px;font-weight:800}
.insight .im{font-size:12px;color:var(--txt2);margin-top:2px;line-height:1.5}
.ins-good{background:rgba(52,211,153,.1);border-color:rgba(52,211,153,.25)}.ins-good .dot{background:var(--pos);box-shadow:0 0 0 4px rgba(52,211,153,.15)}
.ins-warn{background:rgba(251,191,36,.1);border-color:rgba(251,191,36,.28)}.ins-warn .dot{background:var(--warn);box-shadow:0 0 0 4px rgba(251,191,36,.15)}
.ins-bad{background:rgba(251,113,133,.1);border-color:rgba(251,113,133,.3)}.ins-bad .dot{background:var(--neg);box-shadow:0 0 0 4px rgba(251,113,133,.15);animation:pulse 1.4s infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 4px rgba(251,113,133,.15)}50%{box-shadow:0 0 0 8px rgba(251,113,133,.05)}}

.cf-metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.cf-m{text-align:center;padding:10px 6px;background:rgba(255,255,255,.04);border-radius:12px}
.cf-m .k{font-size:9px;color:var(--txt3);font-weight:700;text-transform:uppercase;letter-spacing:.04em}
.cf-m .v{font-size:14px;font-weight:800;margin-top:3px}

/* Category bars */
.cat{margin-bottom:13px}.cat:last-child{margin-bottom:0}
.cat-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.cat-name{font-size:12.5px;font-weight:700;display:flex;align-items:center;gap:8px}
.cat-emoji{width:26px;height:26px;border-radius:8px;background:rgba(255,255,255,.06);display:flex;align-items:center;justify-content:center;font-size:14px}
.cat-val{font-size:12.5px;font-weight:800;color:var(--txt2)}
.bar{height:8px;border-radius:999px;background:rgba(255,255,255,.06);overflow:hidden}
.bar i{display:block;height:100%;border-radius:999px;background:var(--grad);width:0;transition:width 1s cubic-bezier(.2,.8,.2,1)}

/* Transactions */
.tx{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid rgba(255,255,255,.05)}
.tx:last-child{border-bottom:0}
.tx-ic{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:17px;flex:0 0 auto}
.tx-mid{flex:1;min-width:0}
.tx-d{font-size:13.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tx-s{font-size:11px;color:var(--txt3);margin-top:1px}
.tx-v{font-size:14px;font-weight:800;white-space:nowrap}

/* Empty */
.empty{text-align:center;padding:26px 14px}
.empty .e{font-size:34px}.empty p{color:var(--txt2);font-size:13px;margin-top:8px;line-height:1.5}

/* FAB */
.fab{position:fixed;bottom:calc(22px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);z-index:40;display:flex;gap:10px}
.fab button{border:0;cursor:pointer;font-family:inherit;font-weight:800;display:flex;align-items:center;gap:8px;box-shadow:0 12px 34px rgba(99,102,241,.5);transition:.15s}
.fab button:active{transform:scale(.94)}
.fab-main{background:var(--grad);color:#fff;padding:15px 26px;border-radius:999px;font-size:15px}
.fab-mini{background:rgba(255,255,255,.1);color:#fff;border:1px solid var(--card-brd)!important;backdrop-filter:blur(10px);width:52px;height:52px;border-radius:50%;justify-content:center;padding:0;box-shadow:0 8px 24px rgba(0,0,0,.4)!important}

/* Sheet modal */
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.6);backdrop-filter:blur(4px);z-index:60;opacity:0;pointer-events:none;transition:.25s}
.sheet-bg.open{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:61;background:var(--bg2);border-radius:26px 26px 0 0;padding:8px 20px calc(26px + env(safe-area-inset-bottom));max-width:520px;margin:0 auto;transform:translateY(105%);transition:transform .32s cubic-bezier(.2,.9,.2,1);border-top:1px solid var(--card-brd)}
.sheet.open{transform:translateY(0)}
.grab{width:40px;height:4px;border-radius:999px;background:rgba(255,255,255,.2);margin:8px auto 18px}
.sheet h3{font-size:18px;font-weight:800;margin-bottom:16px}
.type-tog{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:16px;background:rgba(255,255,255,.05);padding:5px;border-radius:14px}
.type-tog button{border:0;background:transparent;color:var(--txt2);font-weight:800;font-size:13px;padding:11px;border-radius:10px;cursor:pointer;font-family:inherit;transition:.2s}
.type-tog button.on-exp{background:rgba(251,113,133,.16);color:var(--neg)}
.type-tog button.on-inc{background:rgba(52,211,153,.16);color:var(--pos)}
.fld{margin-bottom:13px}
.fld label{display:block;font-size:11px;font-weight:700;color:var(--txt3);text-transform:uppercase;letter-spacing:.05em;margin-bottom:6px}
.fld input,.fld select{width:100%;background:rgba(255,255,255,.05);border:1px solid var(--card-brd);border-radius:12px;padding:13px 14px;color:var(--txt);font-size:15px;font-family:inherit;outline:none;transition:.2s}
.fld input:focus,.fld select:focus{border-color:var(--brand)}
.big-in{font-size:26px!important;font-weight:800;text-align:center}
.save{width:100%;background:var(--grad);color:#fff;border:0;padding:16px;border-radius:14px;font-size:15px;font-weight:800;cursor:pointer;font-family:inherit;margin-top:6px}
.save:active{transform:scale(.98)}

.reveal{animation:rise .5s cubic-bezier(.2,.8,.2,1) both}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
.d1{animation-delay:.05s}.d2{animation-delay:.1s}.d3{animation-delay:.15s}.d4{animation-delay:.2s}.d5{animation-delay:.25s}

@media(prefers-color-scheme:light){
  :root{--bg:#f4f5fb;--bg2:#fff;--card:#fff;--card-brd:#eceef6;--txt:#141625;--txt2:#5b5f78;--txt3:#9599b5;--shadow:0 20px 50px rgba(99,102,241,.25)}
  .stat,.sec{box-shadow:0 2px 14px rgba(20,22,50,.05)}
  .seg{background:#f1f2f8}.seg button.on{background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.08)}
  .bar,.cat-emoji,.cf-m,.type-tog,.fld input,.fld select{background:#f4f5fb}
  .tx{border-color:#f0f1f7}
}
</style>
</head>
<body>

<div class="top">
  <div class="hi">👋 <span id="greet">Olá</span><b id="uname">Bem-vindo</b></div>
  <div class="top-actions">
    <a class="chip-link" href="index.html">Modo clássico</a>
    <div class="ava" id="ava">FL</div>
  </div>
</div>

<div id="app"></div>

<div class="fab">
  <button class="fab-mini" id="btn-scan" title="Foto do cupom">📷</button>
  <button class="fab-main" id="btn-add">＋ Lançar</button>
</div>

<div class="sheet-bg" id="sheet-bg"></div>
<div class="sheet" id="sheet">
  <div class="grab"></div>
  <h3>Novo lançamento</h3>
  <div class="type-tog" id="type-tog">
    <button data-t="despesa" class="on-exp">− Despesa</button>
    <button data-t="receita">+ Receita</button>
  </div>
  <div class="fld"><label>Valor (R$)</label><input id="in-val" class="big-in num" type="number" inputmode="decimal" placeholder="0,00"></div>
  <div class="fld"><label>Descrição</label><input id="in-desc" type="text" placeholder="Ex: Mercado, Salário…"></div>
  <div class="fld"><label>Conta</label><select id="in-acc"></select></div>
  <div class="fld"><label>Data</label><input id="in-date" type="date"></div>
  <button class="save" id="btn-save">Salvar lançamento</button>
</div>

<script>
const K={acc:'app_accounts_v3',card:'app_creditCards_v3',tx:'app_transactions_v3',cat:'app_categories_v3'};
const load=k=>{try{return JSON.parse(localStorage.getItem(k))||[]}catch(e){return[]}};
const save=(k,v)=>localStorage.setItem(k,JSON.stringify(v));
const BRL=v=>new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'}).format(v||0);
const K_=v=>Math.abs(v)>=1000?(v/1000).toFixed(Math.abs(v)>=10000?0:1).replace('.0','')+'k':Math.round(v);
const startDay=d=>{const x=new Date(d);x.setHours(0,0,0,0);return x};
const iso=d=>{const x=startDay(d);return x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0')};
const parseD=s=>startDay(new Date(String(s).slice(0,10)+'T00:00:00'));

const CAT_EMOJI={'Alimentação':'🍽️','Transporte':'🚗','Moradia':'🏠','Saúde':'💊','Lazer':'🎬','Educação':'📚','Compras':'🛍️','Contas Fixas':'📄','Salário':'💰','Investimentos':'📈','Pagamento de Fatura':'💳','Outros':'✨'};
const emojiFor=c=>CAT_EMOJI[c]||'✨';

let state={accounts:[],cards:[],txs:[],hide:false,cfDays:30};

function recompute(){
  state.accounts.forEach(a=>{
    let b=a.initialBalance||0;
    state.txs.filter(t=>t.accountId===a.id&&!t.isCreditCard).forEach(t=>{
      if(t.fundamentalType==='receita')b+=t.value;
      else if(t.fundamentalType==='despesa'&&t.isPaid&&t.paidByAccountId===a.id)b-=t.value;
    });
    a.balance=b;
  });
  state.cards.forEach(c=>{
    let u=0;state.txs.filter(t=>t.accountId===c.id&&t.isCreditCard).forEach(t=>{u+=t.fundamentalType==='despesa'?t.value:-t.value});
    c.availableLimit=(c.limit||0)-Math.max(0,u);
  });
}
const totalBalance=()=>state.accounts.reduce((s,a)=>s+(a.balance||0),0);
const cardDebt=()=>state.cards.reduce((s,c)=>s+Math.max(0,(c.limit||0)-(c.availableLimit||0)),0);
const netWorth=()=>totalBalance()-cardDebt();

function monthAgg(offset=0){
  const now=new Date();const m=now.getMonth()-offset,y=now.getFullYear();
  const d=new Date(y,m,1);const pm=d.getMonth(),py=d.getFullYear();
  const t=state.txs.filter(x=>{const dd=parseD(x.date);return dd.getMonth()===pm&&dd.getFullYear()===py});
  return{income:t.filter(x=>x.fundamentalType==='receita').reduce((s,x)=>s+x.value,0),
         expense:t.filter(x=>x.fundamentalType==='despesa').reduce((s,x)=>s+x.value,0)};
}

/* ── Live cash flow (regras locais) ── */
function project(days){
  const today=startDay(new Date());const hz=new Date(today);hz.setDate(hz.getDate()+days);
  let start=totalBalance();
  const futInc=state.txs.filter(t=>t.fundamentalType==='receita'&&parseD(t.date)>today);
  start-=futInc.reduce((s,t)=>s+t.value,0);
  const overdue=state.txs.filter(t=>t.fundamentalType==='despesa'&&!t.isCreditCard&&!t.isPaid&&parseD(t.date)<today);
  const ovSum=overdue.reduce((s,t)=>s+t.value,0);
  const ev={};const add=(dt,a)=>{let d=startDay(dt);if(d<today)d=new Date(today);if(d>hz)return;(ev[iso(d)]=ev[iso(d)]||[]).push(a)};
  futInc.forEach(t=>add(parseD(t.date),+t.value));
  state.txs.filter(t=>t.fundamentalType==='despesa'&&!t.isCreditCard&&!t.isPaid&&parseD(t.date)>=today).forEach(t=>add(parseD(t.date),-t.value));
  if(ovSum>0)add(new Date(today),-ovSum);
  state.cards.forEach(c=>{const u=Math.max(0,(c.limit||0)-(c.availableLimit||0));if(u<=0||!c.dueDay)return;let due=new Date(today.getFullYear(),today.getMonth(),c.dueDay);if(due<today)due=new Date(today.getFullYear(),today.getMonth()+1,c.dueDay);if(due<=hz)add(due,-u)});
  const pts=[];let run=start,low={d:new Date(today),b:run},breach=null;
  for(let i=0;i<=days;i++){const d=new Date(today);d.setDate(d.getDate()+i);const evs=ev[iso(d)]||[];run+=evs.reduce((s,a)=>s+a,0);run=Math.round(run*100)/100;pts.push({d:new Date(d),b:run});if(run<low.b)low={d:new Date(d),b:run};if(!breach&&run<0)breach={d:new Date(d),b:run}}
  return{today,days,start:Math.round(start*100)/100,end:pts[pts.length-1].b,pts,low,breach};
}
function insight(p){
  const f=v=>BRL(Math.abs(v));
  if(p.breach){const dd=Math.round((p.breach.d-p.today)/864e5);const q=dd<=0?'hoje':dd===1?'amanhã':`em ${dd} dias (${p.breach.d.toLocaleDateString('pt-BR')})`;
    return{lvl:'bad',t:'Risco de saldo negativo',m:`Nesse ritmo, seu saldo fica negativo ${q}. Faltam ${f(p.breach.b)}. Considere adiar gastos ou antecipar uma entrada.`}}
  if(p.low.b<300)return{lvl:'warn',t:'Mês apertado',m:`Seu ponto mais baixo será ${f(p.low.b)} em ${p.low.d.toLocaleDateString('pt-BR')}. Segure os supérfluos.`};
  return{lvl:'good',t:'Tudo sob controle',m:`Projeção saudável: você fecha o período com cerca de ${f(p.end)}.`};
}

/* ── SVG area chart ── */
function areaSVG(vals,w,h,pad){
  pad=pad||6;const min=Math.min(...vals,0),max=Math.max(...vals,0);const rng=(max-min)||1;
  const X=i=>pad+i*((w-2*pad)/((vals.length-1)||1));
  const Y=v=>pad+(1-(v-min)/rng)*(h-2*pad);
  let line=vals.map((v,i)=>(i?'L':'M')+X(i).toFixed(1)+' '+Y(v).toFixed(1)).join(' ');
  const area=line+` L ${X(vals.length-1).toFixed(1)} ${(h-pad).toFixed(1)} L ${X(0).toFixed(1)} ${(h-pad).toFixed(1)} Z`;
  const zeroY=min<0?Y(0):null;
  return{line,area,zeroY,X,Y,min,max};
}

/* ── Render ── */
function render(){
  recompute();
  const app=document.getElementById('app');
  if(!state.accounts.length){
    app.innerHTML=`<div class="sec reveal"><div class="empty"><div class="e">🌱</div>
      <p>Você ainda não tem contas cadastradas.<br>Abra o <a href="index.html" style="color:var(--brand);font-weight:700">modo clássico</a> para criar sua primeira conta — depois volte aqui para a nova experiência.</p></div></div>`;
    return;
  }
  const nw=netWorth();const cur=monthAgg(0);const prev=monthAgg(1);
  const bal=totalBalance();
  const prevNw=nw-(cur.income-cur.expense);
  const deltaPct=prevNw!==0?((nw-prevNw)/Math.abs(prevNw)*100):0;

  // 6-month net worth sparkline (approx)
  const spark=[];let acc=nw;spark.unshift(acc);
  for(let i=0;i<5;i++){const a=monthAgg(i);acc-=(a.income-a.expense);spark.unshift(acc)}
  const sw=window.innerWidth>520?488:window.innerWidth-32,sh=44;
  const sp=areaSVG(spark,sw,sh);

  const p=project(state.cfDays);const ins=insight(p);
  const cw=sw,ch=150;const cv=p.pts.map(x=>x.b);const ca=areaSVG(cv,cw,ch,10);
  const breachIdx=p.breach?p.pts.findIndex(x=>iso(x.d)===iso(p.breach.d)):-1;

  // categories (current month expenses)
  const now=new Date();const mtx=state.txs.filter(t=>{const d=parseD(t.date);return t.fundamentalType==='despesa'&&d.getMonth()===now.getMonth()&&d.getFullYear()===now.getFullYear()});
  const byCat={};mtx.forEach(t=>byCat[t.category||'Outros']=(byCat[t.category||'Outros']||0)+t.value);
  const cats=Object.entries(byCat).sort((a,b)=>b[1]-a[1]).slice(0,5);const maxCat=cats.length?cats[0][1]:1;

  // recent
  const recent=[...state.txs].sort((a,b)=>parseD(b.date)-parseD(a.date)).slice(0,6);
  const accName=id=>{const a=state.accounts.find(x=>x.id===id)||state.cards.find(x=>x.id===id);return a?a.name:'—'};

  const hv=v=>state.hide?'•••••':BRL(v);

  app.innerHTML=`
  <div class="hero reveal">
    <div class="hero-lbl">Patrimônio líquido <span class="eye" id="eye">${state.hide?'🙈':'👁️'}</span></div>
    <div class="hero-val num">${hv(nw)}</div>
    <div class="hero-delta">${deltaPct>=0?'▲':'▼'} ${Math.abs(deltaPct).toFixed(1)}% <span style="opacity:.8;font-weight:600">vs mês passado</span></div>
    <div class="hero-spark">
      <svg width="100%" height="${sh}" viewBox="0 0 ${sw} ${sh}" preserveAspectRatio="none">
        <defs><linearGradient id="sg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="rgba(255,255,255,.4)"/><stop offset="1" stop-color="rgba(255,255,255,0)"/></linearGradient></defs>
        <path d="${sp.area}" fill="url(#sg)"/><path d="${sp.line}" fill="none" stroke="#fff" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
      </svg>
    </div>
  </div>

  <div class="trio reveal d1">
    <div class="stat"><div class="ic" style="background:rgba(124,123,255,.15)">💼</div><div class="k">Saldo</div><div class="v num">${hv(bal)}</div></div>
    <div class="stat"><div class="ic" style="background:rgba(52,211,153,.15)">↑</div><div class="k">Entradas</div><div class="v num" style="color:var(--pos)">${hv(cur.income)}</div></div>
    <div class="stat"><div class="ic" style="background:rgba(251,113,133,.15)">↓</div><div class="k">Saídas</div><div class="v num" style="color:var(--neg)">${hv(cur.expense)}</div></div>
  </div>

  <div class="sec reveal d2">
    <div class="sec-h">
      <div><div class="sec-t">Fluxo de Caixa Vivo</div><div class="sec-sub">Projeção do saldo dia a dia</div></div>
      <div class="seg" id="cf-seg">
        ${[30,60,90].map(d=>`<button data-d="${d}" class="${state.cfDays===d?'on':''}">${d}d</button>`).join('')}
      </div>
    </div>
    <div class="insight ins-${ins.lvl}"><div class="dot"></div><div><div class="it">${ins.t}</div><div class="im">${ins.m}</div></div></div>
    <svg width="100%" height="${ch}" viewBox="0 0 ${cw} ${ch}" preserveAspectRatio="none">
      <defs><linearGradient id="cg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="rgba(124,123,255,.35)"/><stop offset="1" stop-color="rgba(124,123,255,0)"/></linearGradient></defs>
      ${ca.zeroY!=null?`<line x1="0" y1="${ca.zeroY.toFixed(1)}" x2="${cw}" y2="${ca.zeroY.toFixed(1)}" stroke="rgba(251,113,133,.5)" stroke-width="1" stroke-dasharray="4 4"/>`:''}
      <path d="${ca.area}" fill="url(#cg)"/>
      <path d="${ca.line}" fill="none" stroke="${p.breach?'#fb7185':'#7c7bff'}" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
      ${breachIdx>=0?`<circle cx="${ca.X(breachIdx).toFixed(1)}" cy="${ca.Y(cv[breachIdx]).toFixed(1)}" r="5" fill="#fb7185" stroke="#fff" stroke-width="2"/>`:''}
    </svg>
    <div class="cf-metrics">
      <div class="cf-m"><div class="k">Hoje</div><div class="v num">${K_(p.start)>=0?'R$ '+K_(p.start):'−R$ '+K_(Math.abs(p.start))}</div></div>
      <div class="cf-m"><div class="k">Ponto baixo</div><div class="v num" style="color:${p.low.b<0?'var(--neg)':'var(--txt)'}">${p.low.b>=0?'R$ '+K_(p.low.b):'−R$ '+K_(Math.abs(p.low.b))}</div></div>
      <div class="cf-m"><div class="k">Projetado</div><div class="v num" style="color:${p.end<0?'var(--neg)':'var(--pos)'}">${p.end>=0?'R$ '+K_(p.end):'−R$ '+K_(Math.abs(p.end))}</div></div>
    </div>
  </div>

  <div class="sec reveal d3">
    <div class="sec-h"><div class="sec-t">Para onde vai seu dinheiro</div><div class="sec-sub">${now.toLocaleDateString('pt-BR',{month:'long'})}</div></div>
    ${cats.length?cats.map(([c,v])=>`
      <div class="cat"><div class="cat-top"><div class="cat-name"><span class="cat-emoji">${emojiFor(c)}</span>${c}</div><div class="cat-val num">${hv(v)}</div></div>
      <div class="bar"><i data-w="${Math.max(6,v/maxCat*100)}"></i></div></div>`).join(''):'<div class="empty"><div class="e">🍃</div><p>Sem despesas neste mês ainda.</p></div>'}
  </div>

  <div class="sec reveal d4">
    <div class="sec-h"><div class="sec-t">Últimos lançamentos</div></div>
    ${recent.length?recent.map(t=>{const inc=t.fundamentalType==='receita';return `
      <div class="tx"><div class="tx-ic" style="background:${inc?'rgba(52,211,153,.14)':'rgba(251,113,133,.12)'}">${emojiFor(t.category)}</div>
      <div class="tx-mid"><div class="tx-d">${t.description||t.category||'Lançamento'}</div><div class="tx-s">${parseD(t.date).toLocaleDateString('pt-BR',{day:'2-digit',month:'short'})} · ${accName(t.accountId)}${t.isPaid?'':' · <span style="color:var(--warn)">a pagar</span>'}</div></div>
      <div class="tx-v num" style="color:${inc?'var(--pos)':'var(--neg)'}">${inc?'+':'−'}${state.hide?'•••':BRL(t.value)}</div></div>`}).join(''):'<div class="empty"><div class="e">📭</div><p>Nenhum lançamento ainda. Toque em <b>＋ Lançar</b>.</p></div>'}
  </div>`;

  requestAnimationFrame(()=>document.querySelectorAll('.bar i').forEach(i=>i.style.width=i.dataset.w+'%'));
  document.getElementById('eye').onclick=()=>{state.hide=!state.hide;render()};
  document.querySelectorAll('#cf-seg button').forEach(b=>b.onclick=()=>{state.cfDays=+b.dataset.d;render()});
}

/* ── Quick add ── */
let addType='despesa';
function openSheet(){
  const sel=document.getElementById('in-acc');
  sel.innerHTML=state.accounts.map(a=>`<option value="${a.id}">${a.name}</option>`).join('');
  document.getElementById('in-date').value=iso(new Date());
  document.getElementById('in-val').value='';document.getElementById('in-desc').value='';
  document.getElementById('sheet-bg').classList.add('open');document.getElementById('sheet').classList.add('open');
  setTimeout(()=>document.getElementById('in-val').focus(),300);
}
function closeSheet(){document.getElementById('sheet-bg').classList.remove('open');document.getElementById('sheet').classList.remove('open')}
function saveTx(){
  const val=parseFloat(document.getElementById('in-val').value);
  if(!val||val<=0){document.getElementById('in-val').focus();return}
  const accId=document.getElementById('in-acc').value;
  const tx={id:crypto.randomUUID(),description:document.getElementById('in-desc').value||(addType==='receita'?'Receita':'Despesa'),
    value:val,date:document.getElementById('in-date').value||iso(new Date()),fundamentalType:addType,category:'Outros',
    isPaid:true,accountId:accId||null,isCreditCard:false,installments:null,groupId:null,isRecurring:false,
    paidByAccountId:addType==='despesa'?(accId||null):null,paidByIsCreditCard:false};
  state.txs.push(tx);recompute();
  save(K.tx,state.txs);save(K.acc,state.accounts);save(K.card,state.cards);
  closeSheet();render();
}

/* ── Init ── */
function init(){
  state.accounts=load(K.acc);state.cards=load(K.card);state.txs=load(K.tx);
  const h=new Date().getHours();document.getElementById('greet').textContent=h<12?'Bom dia':h<18?'Boa tarde':'Boa noite';
  try{const u=JSON.parse(localStorage.getItem('auth_user')||'null');if(u&&u.name){document.getElementById('uname').textContent=u.name.split(' ')[0];document.getElementById('ava').textContent=u.name.split(' ').slice(0,2).map(w=>w[0]).join('').toUpperCase()}}catch(e){}
  render();
  document.getElementById('btn-add').onclick=openSheet;
  document.getElementById('btn-scan').onclick=()=>location.href='index.html';
  document.getElementById('sheet-bg').onclick=closeSheet;
  document.getElementById('btn-save').onclick=saveTx;
  document.querySelectorAll('#type-tog button').forEach(b=>b.onclick=()=>{addType=b.dataset.t;
    document.querySelectorAll('#type-tog button').forEach(x=>x.className='');
    b.className=addType==='despesa'?'on-exp':'on-inc';});
  window.addEventListener('resize',()=>{clearTimeout(window._rz);window._rz=setTimeout(render,200)});
}
init();
</script>
</body>
</html>
